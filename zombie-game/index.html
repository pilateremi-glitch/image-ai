<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧟 Zombie Survival — Tour par Tour</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--neon:#39ff14;--neon2:#00eeff;--danger:#ff1744;--warn:#ffaa00;--dark:#060a06;--panel:#0c120c;--border:#1a2a1a}
body{background:var(--dark);color:#b0c0b0;font-family:'Courier New',monospace;height:100vh;overflow:hidden;user-select:none}
#main-menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0a1f0a 0%,#060a06 70%);z-index:100}
#main-menu::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,#39ff1406 31px,#39ff1406 32px),repeating-linear-gradient(90deg,transparent,transparent 31px,#39ff1406 31px,#39ff1406 32px);pointer-events:none}
#main-menu h1{font-size:3.2rem;color:var(--neon);text-shadow:0 0 20px var(--neon),0 0 60px #39ff1444;margin-bottom:.4rem;letter-spacing:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 20px var(--neon),0 0 60px #39ff1444}50%{text-shadow:0 0 30px var(--neon),0 0 80px #39ff1466,0 0 120px #39ff1422}}
#main-menu .subtitle{color:#4a6a4a;margin-bottom:3rem;font-size:.85rem;letter-spacing:3px}
.menu-btn{display:block;width:260px;padding:13px 0;margin:7px auto;border:1px solid var(--neon);background:transparent;color:var(--neon);font-family:inherit;font-size:.95rem;letter-spacing:3px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.menu-btn::before{content:'';position:absolute;inset:0;background:var(--neon);transform:scaleX(0);transform-origin:left;transition:transform .2s;opacity:.1}
.menu-btn:hover::before{transform:scaleX(1)}
.menu-btn:hover{box-shadow:0 0 12px #39ff1444;text-shadow:0 0 8px var(--neon)}
.menu-btn.danger{border-color:var(--danger);color:var(--danger)}
.menu-btn.danger:hover{box-shadow:0 0 12px #ff174444}
.menu-btn:disabled{opacity:.25;cursor:not-allowed}
#game-container{display:none;flex-direction:column;height:100vh;overflow:hidden}
#top-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:5px 10px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
.res-item{display:flex;align-items:center;gap:3px;font-size:.76rem;white-space:nowrap}
.res-item span.icon{font-size:.9rem}
.res-item span.val{font-weight:bold}
.res-gold{color:#ffcc00}.res-scrap{color:#8a9a8a}.res-wood{color:#88dd00}.res-energy{color:#00ccff}.res-crystal{color:#cc88ff}.res-tech{color:#00eeff}.res-xp{color:#ffaa00}
#wave-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.82rem}
#wave-badge{background:#0a1a0a;border:1px solid #39ff1433;padding:3px 10px;color:var(--neon);letter-spacing:2px;text-shadow:0 0 6px var(--neon)}
#game-body{display:flex;flex:1;overflow:hidden;min-height:0}
#left-panel{width:185px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#drawer-handle{display:none}
#build-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.build-tab{flex:1;padding:5px 1px;font-size:.6rem;background:none;border:none;color:#4a6a4a;cursor:pointer;font-family:inherit;letter-spacing:.5px;min-width:0;text-align:center;transition:.15s}
.build-tab.active{color:var(--neon);border-bottom:2px solid var(--neon);text-shadow:0 0 6px var(--neon)}
.build-tab:hover:not(.active){color:#8ab88a}
#build-list{flex:1;overflow-y:auto;padding:5px}
#build-list::-webkit-scrollbar{width:3px}
#build-list::-webkit-scrollbar-thumb{background:#1a2a1a}
.build-item{padding:5px 7px;margin-bottom:3px;border:1px solid #1a2a1a;cursor:pointer;transition:all .15s}
.build-item:hover{border-color:#39ff1433;background:#0a160a}
.build-item.selected{border-color:var(--neon);background:#0a160a;box-shadow:0 0 6px #39ff1422}
.build-item.locked{opacity:.3;cursor:not-allowed}
.build-item .bi-header{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.build-item .bi-name{font-size:.7rem;color:#a0b8a0}
.build-item .bi-cost{font-size:.6rem;color:#4a6a4a}
.build-item .bi-desc{font-size:.58rem;color:#334a33;margin-top:1px}
#canvas-container{flex:1;display:flex;align-items:center;justify-content:center;background:#040804;overflow:hidden;position:relative}
#game-canvas{cursor:crosshair}
#right-panel{width:185px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;padding:7px}
#right-panel h3{font-size:.7rem;color:var(--neon);letter-spacing:2px;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border);text-shadow:0 0 6px var(--neon)}
#event-box{background:#080f08;border:1px solid var(--border);padding:5px;margin-bottom:7px;font-size:.65rem;min-height:44px}
#event-box .ev-name{color:var(--warn);font-weight:bold;margin-bottom:2px}
#event-box .ev-desc{color:#5a7a5a}
#cell-info{background:#08080f;border:1px solid #1a1a2a;padding:5px;margin-bottom:7px;font-size:.65rem;min-height:55px}
#cell-info .ci-title{color:var(--neon2);margin-bottom:2px}
#cell-info .ci-hp{color:#4a6a5a}
#camp-box{border:1px solid var(--border);padding:5px;margin-bottom:7px}
#camp-box .camp-name{color:var(--neon);font-size:.75rem;font-weight:bold;margin-bottom:3px;text-shadow:0 0 6px var(--neon)}
#camp-hp-bar{height:5px;background:#1a2a1a;margin-bottom:3px}
#camp-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),var(--neon));transition:width .3s}
#camp-upgrade-btn{width:100%;padding:4px;font-size:.6rem;border:1px solid var(--warn);background:none;color:var(--warn);cursor:pointer;font-family:inherit;letter-spacing:1px;transition:.2s}
#camp-upgrade-btn:hover{background:#ffaa0022;text-shadow:0 0 6px var(--warn)}
#camp-upgrade-btn:disabled{opacity:.25;cursor:not-allowed}
#heroes-list{flex:1;overflow-y:auto}
#heroes-list::-webkit-scrollbar{width:3px}
#heroes-list::-webkit-scrollbar-thumb{background:#1a2a1a}
.hero-card{background:#080f08;border:1px solid #1a2a1a;padding:4px;margin-bottom:3px;font-size:.62rem}
.hero-card .hc-name{color:#8ab88a;margin-bottom:1px}
.hero-card .hc-level{color:var(--warn)}
/* SPECIALS BAR */
#specials-bar{background:#060e06;border-top:1px solid #1a2a1a;border-bottom:1px solid #1a2a1a;padding:4px 10px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#specials-bar .sp-label{font-size:.6rem;color:#3a5a3a;white-space:nowrap;margin-right:2px}
.sp-btn{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border:1px solid #1a2a1a;background:#080f08;color:#4a6a4a;cursor:not-allowed;font-family:inherit;font-size:.58rem;transition:all .2s;min-width:72px;position:relative;overflow:hidden}
.sp-btn.ready{border-color:var(--neon);color:var(--neon);cursor:pointer;box-shadow:0 0 8px #39ff1433;animation:sp-pulse .8s ease-in-out infinite}
@keyframes sp-pulse{0%,100%{box-shadow:0 0 8px #39ff1433}50%{box-shadow:0 0 14px #39ff1466}}
.sp-btn:disabled{opacity:.4}
.sp-icon{font-size:1rem;line-height:1.1}
.sp-name{font-size:.55rem;letter-spacing:.5px;margin:1px 0}
.sp-bar{width:100%;height:2px;background:#1a2a1a;margin-top:2px}
.sp-fill{height:100%;background:var(--neon);transition:width .5s linear}
.sp-timer{font-size:.55rem;color:#3a5a3a;min-height:8px}
.sp-btn.ready .sp-timer{color:var(--neon);font-weight:bold}
#bottom-bar{background:var(--panel);border-top:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#launch-btn{padding:7px 20px;background:#0a1f0a;border:1px solid var(--neon);color:var(--neon);font-family:inherit;font-size:.85rem;cursor:pointer;letter-spacing:2px;transition:all .2s;text-shadow:0 0 6px var(--neon)}
#launch-btn:hover{background:#0f2a0f;box-shadow:0 0 12px #39ff1444}
#launch-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;text-shadow:none}
.speed-btn{padding:4px 8px;background:none;border:1px solid #1a2a1a;color:#3a5a3a;font-family:inherit;font-size:.72rem;cursor:pointer;transition:.15s}
.speed-btn.active{border-color:var(--neon);color:var(--neon)}
.speed-btn:hover{color:#8ab88a}
#sell-btn{padding:5px 10px;background:none;border:1px solid var(--danger);color:var(--danger);font-family:inherit;font-size:.72rem;cursor:pointer;transition:.15s}
#sell-btn:hover{background:#ff174422}
#msg-bar{margin-left:auto;font-size:.75rem;color:var(--warn);min-width:160px;text-align:right}
#modal-overlay{display:none;position:fixed;inset:0;background:#0009;z-index:200;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:#0c120c;border:1px solid #39ff1444;padding:20px;min-width:480px;max-width:680px;max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 0 30px #39ff1422}
#modal-box h2{color:var(--neon);margin-bottom:14px;font-size:1rem;letter-spacing:3px;text-shadow:0 0 8px var(--neon)}
#modal-close{position:absolute;top:10px;right:14px;background:none;border:none;color:#3a5a3a;font-size:1.1rem;cursor:pointer;font-family:inherit}
#modal-close:hover{color:var(--danger)}
.tech-branch{margin-bottom:14px}
.tech-branch h4{color:var(--neon2);font-size:.76rem;margin-bottom:7px;text-transform:uppercase;letter-spacing:2px}
.tech-grid{display:flex;gap:7px;flex-wrap:wrap}
.tech-node{border:1px solid #1a2a1a;padding:7px;width:135px;cursor:pointer;transition:all .2s;font-size:.65rem}
.tech-node.unlocked{border-color:var(--neon);background:#080f08;box-shadow:0 0 6px #39ff1422}
.tech-node.available{border-color:#ffaa0066}
.tech-node.locked{opacity:.35;cursor:not-allowed}
.tech-node:hover:not(.locked){border-color:#39ff1066}
.tech-node .tn-name{color:#8ab88a;font-weight:bold;margin-bottom:2px}
.tech-node .tn-desc{color:#3a5a3a;margin-bottom:2px}
.tech-node .tn-cost{color:var(--neon2)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat-item{background:#080f08;padding:7px;font-size:.72rem;border:1px solid #1a2a1a}
.stat-item .si-label{color:#3a5a3a;margin-bottom:2px}
.stat-item .si-val{color:var(--neon);font-size:1.05rem;font-weight:bold;text-shadow:0 0 6px var(--neon)}
#gameover-screen{display:none;position:fixed;inset:0;background:#000d;z-index:300;align-items:center;justify-content:center;flex-direction:column}
#gameover-screen.open{display:flex}
#gameover-screen h1{font-size:3rem;color:var(--danger);text-shadow:0 0 30px #ff174488;margin-bottom:1rem;animation:pulse 1s infinite}
#gameover-screen p{color:#4a6a4a;margin-bottom:2rem}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:#1a2a1a}

/* ===== RESPONSIVE MOBILE ===== */
#mobile-toggle{display:none}
#mobile-fab{display:none}
#drawer-backdrop{display:none;position:fixed;inset:0;background:#000b;z-index:55}
#drawer-backdrop.open{display:block}

@media(max-width:768px){
  /* Panels */
  #right-panel{display:none}
  /* Left panel → bottom drawer */
  #left-panel{
    position:fixed;bottom:0;left:0;right:0;
    width:100%!important;height:52vh;
    border-right:none;border-top:2px solid var(--neon);
    z-index:60;transform:translateY(102%);transition:transform .3s ease;
    box-shadow:0 -6px 24px #39ff1422
  }
  #left-panel.open{transform:translateY(0)}
  /* Mobile toggle FAB */
  #mobile-toggle{
    display:flex;align-items:center;justify-content:center;
    position:fixed;bottom:68px;right:14px;
    width:46px;height:46px;border-radius:50%;
    background:#0a1a0a;border:2px solid var(--neon);color:var(--neon);
    font-size:1.3rem;z-index:70;cursor:pointer;
    box-shadow:0 0 14px #39ff1455;transition:all .2s
  }
  #mobile-toggle:hover{box-shadow:0 0 22px #39ff1488}
  /* Launch FAB */
  #mobile-fab{
    display:flex;align-items:center;justify-content:center;
    position:fixed;bottom:14px;right:14px;
    width:54px;height:54px;border-radius:50%;
    background:#0a2a0a;border:2px solid var(--neon);color:var(--neon);
    font-size:1.5rem;z-index:70;cursor:pointer;font-family:inherit;
    box-shadow:0 0 18px #39ff1466;transition:all .2s;animation:pulse 2s infinite
  }
  #mobile-fab:disabled{opacity:.3;box-shadow:none;animation:none;cursor:not-allowed}
  #mobile-fab.wave{border-color:var(--danger);color:var(--danger);box-shadow:0 0 18px #ff174466;background:#1a0000}
  /* Top bar compact */
  #top-bar{padding:4px 6px;gap:7px}
  .res-item span.icon{font-size:.82rem}
  .res-item span.val{font-size:.72rem}
  #wave-badge{padding:2px 7px;font-size:.7rem}
  #phase-label{display:none}
  /* Specials bar compact */
  #specials-bar{padding:3px 6px;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sp-btn{min-width:54px;padding:2px 4px}
  .sp-name{display:none}
  .sp-timer{font-size:.5rem}
  /* Bottom bar */
  #launch-btn{display:none}
  #bottom-bar{padding:5px 8px;gap:6px;justify-content:flex-start}
  #msg-bar{display:none}
  /* Canvas touch */
  #canvas-container{touch-action:none}
  /* Drawer handle */
  #drawer-handle{
    display:flex;align-items:center;padding:7px 14px;
    background:#0a1a0a;border-bottom:1px solid var(--border);
    cursor:pointer;flex-shrink:0;
    font-size:.75rem;color:var(--neon);letter-spacing:2px
  }
  #drawer-handle-arrow{margin-right:8px;transition:transform .3s}
  #left-panel.open #drawer-handle-arrow{transform:rotate(180deg)}
  /* Sell button bigger on mobile */
  #sell-btn{padding:6px 12px;font-size:.72rem}
}
@media(max-width:480px){
  .res-item:nth-child(n+5){display:none}
  #wave-info{font-size:.72rem}
}
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="main-menu">
  <h1>🧟 ZOMBIE SURVIVAL</h1>
  <div class="subtitle">— STRATÉGIE TOUR PAR TOUR —</div>
  <button class="menu-btn" id="btn-new-game">NOUVELLE PARTIE</button>
  <button class="menu-btn" id="btn-continue" disabled>CONTINUER</button>
  <button class="menu-btn" id="btn-tech-tree-menu" disabled>ARBRE TECHNOLOGIQUE</button>
  <button class="menu-btn" id="btn-stats-menu" disabled>STATISTIQUES</button>
  <button class="menu-btn danger" id="btn-erase">EFFACER SAUVEGARDE</button>
</div>

<!-- GAME CONTAINER -->
<div id="game-container">
  <!-- TOP BAR -->
  <div id="top-bar">
    <div class="res-item res-gold"><span class="icon">🪙</span><span class="val" id="r-gold">0</span></div>
    <div class="res-item res-scrap"><span class="icon">⚙️</span><span class="val" id="r-scrap">0</span></div>
    <div class="res-item res-wood"><span class="icon">🌲</span><span class="val" id="r-wood">0</span></div>
    <div class="res-item res-energy"><span class="icon">⚡</span><span class="val" id="r-energy">0</span></div>
    <div class="res-item res-crystal"><span class="icon">💎</span><span class="val" id="r-crystal">0</span></div>
    <div class="res-item res-tech"><span class="icon">🔬</span><span class="val" id="r-tech">0</span></div>
    <div class="res-item res-xp"><span class="icon">⭐</span><span class="val" id="r-xp">0</span></div>
    <div id="wave-info">
      <span id="wave-badge">VAGUE 0</span>
      <span id="phase-label" style="font-size:.75rem;color:#6b7280">CONSTRUCTION</span>
    </div>
  </div>

  <!-- MAIN BODY -->
  <div id="game-body">
    <!-- LEFT PANEL (desktop) + MOBILE DRAWER -->
    <div id="left-panel">
      <!-- Mobile drawer handle (hidden on desktop via CSS) -->
      <div id="drawer-handle" onclick="toggleMobilePanel()">
        <span id="drawer-handle-arrow">▼</span>
        <span style="flex:1;text-align:center">🏗 CONSTRUIRE</span>
        <span id="drawer-camp-mini" style="color:#ffaa00;font-size:.65rem"></span>
      </div>
      <div id="build-tabs">
        <button class="build-tab active" data-tab="walls">Murs</button>
        <button class="build-tab" data-tab="towers">Tours</button>
        <button class="build-tab" data-tab="traps">Pièges</button>
        <button class="build-tab" data-tab="support">Bâtim.</button>
        <button class="build-tab" data-tab="heroes">Héros</button>
        <button class="build-tab" data-tab="troops" style="color:#ff8800">Troupes</button>
      </div>
      <div id="build-list"></div>
    </div>

    <!-- CANVAS -->
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel">
      <h3>ÉVÉNEMENT</h3>
      <div id="event-box"><div class="ev-desc">Aucun événement</div></div>

      <h3>CELLULE SÉLECT.</h3>
      <div id="cell-info"><div class="ci-title">Cliquez une cellule</div></div>

      <h3>BASE</h3>
      <div id="camp-box">
        <div class="camp-name" id="camp-name-lbl">Camp Niv.1</div>
        <div id="camp-hp-bar"><div id="camp-hp-fill" style="width:100%"></div></div>
        <div style="font-size:.62rem;color:#6b7280;margin-bottom:5px" id="camp-hp-lbl">500 / 500 HP</div>
        <button id="camp-upgrade-btn">⬆ AMÉLIORER</button>
      </div>

      <h3>HÉROS ACTIFS</h3>
      <div id="heroes-list"></div>
    </div>
  </div>

  <!-- SPECIALS BAR -->
  <div id="specials-bar">
    <span class="sp-label">⚡ CAPACITÉS:</span>
    <button class="sp-btn" id="sp-AIRSTRIKE" onclick="activateSpecial('AIRSTRIKE')">
      <span class="sp-icon">✈</span><span class="sp-name">FRAPPE AÉRIENNE</span>
      <div class="sp-bar"><div class="sp-fill" id="spfill-AIRSTRIKE" style="width:100%"></div></div>
      <span class="sp-timer" id="sptxt-AIRSTRIKE">PRÊT!</span>
    </button>
    <button class="sp-btn" id="sp-EMP" onclick="activateSpecial('EMP')">
      <span class="sp-icon">⚡</span><span class="sp-name">IMPULSION EMP</span>
      <div class="sp-bar"><div class="sp-fill" id="spfill-EMP" style="width:100%"></div></div>
      <span class="sp-timer" id="sptxt-EMP">PRÊT!</span>
    </button>
    <button class="sp-btn" id="sp-REPAIR" onclick="activateSpecial('REPAIR')">
      <span class="sp-icon">🔧</span><span class="sp-name">RÉPARATION</span>
      <div class="sp-bar"><div class="sp-fill" id="spfill-REPAIR" style="width:100%"></div></div>
      <span class="sp-timer" id="sptxt-REPAIR">PRÊT!</span>
    </button>
    <button class="sp-btn" id="sp-BERSERK" onclick="activateSpecial('BERSERK')">
      <span class="sp-icon">💢</span><span class="sp-name">MODE BERSERK</span>
      <div class="sp-bar"><div class="sp-fill" id="spfill-BERSERK" style="width:100%"></div></div>
      <span class="sp-timer" id="sptxt-BERSERK">PRÊT!</span>
    </button>
    <button class="sp-btn" id="sp-NAPALM" onclick="activateSpecial('NAPALM')">
      <span class="sp-icon">🔥</span><span class="sp-name">NAPALM</span>
      <div class="sp-bar"><div class="sp-fill" id="spfill-NAPALM" style="width:100%"></div></div>
      <span class="sp-timer" id="sptxt-NAPALM">PRÊT!</span>
    </button>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottom-bar">
    <button id="launch-btn">⚔ LANCER LA VAGUE</button>
    <div style="display:flex;gap:4px;align-items:center">
      <span style="font-size:.7rem;color:#6b7280">VITESSE:</span>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="2">2×</button>
      <button class="speed-btn" data-speed="4">4×</button>
    </div>
    <button id="sell-btn">💰 VENDRE</button>
    <button class="menu-btn" id="btn-tech-ingame" style="width:auto;padding:6px 12px;font-size:.72rem;display:inline-block;margin:0">🔬 TECHNO</button>
    <button class="menu-btn" id="btn-stats-ingame" style="width:auto;padding:6px 12px;font-size:.72rem;display:inline-block;margin:0">📊 STATS</button>
    <button class="menu-btn danger" id="btn-menu-ingame" style="width:auto;padding:6px 12px;font-size:.72rem;display:inline-block;margin:0">🏠 MENU</button>
    <div id="msg-bar"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close">✕</button>
    <h2 id="modal-title"></h2>
    <div id="modal-content"></div>
  </div>
</div>

<!-- MOBILE FABs -->
<button id="mobile-toggle" onclick="toggleMobilePanel()" title="Menu construction">🏗</button>
<button id="mobile-fab" onclick="mobileLaunch()" title="Lancer / Vitesse">⚔</button>

function defaultState() {
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = { type: c === 0 ? 'base' : 'empty', buildingId: null, hp: null, maxHp: null };
    }
  }
  return {
    resources: { gold:2500, scrap:600, wood:900, energy:120, crystals:25, techPoints:20, xp:0 },
    camp: { level:1, hp:500, maxHp:500, shield:0 },
    wave: 0,
    phase: 'build', // 'build' | 'wave' | 'gameover'
    grid,
    buildings: {},    // id -> building obj
    nextBuildId: 1,
    zombies: {},      // id -> zombie obj
    nextZombieId: 1,
    projectiles: [],
    effects: [],
    heroes: [],       // placed hero objects
    research: {},     // techId -> true

    eventModifiers: {},

// ================================================================
// SECTION 3a: MOBILE TROOPS DRAWING & LOGIC
// ================================================================
function drawTroops() {
  for (const t of G.troops) {
    if (t.hp <= 0) continue;
    const mu = MOBILE_UNITS[t.typeId];
    const r = CELL * 0.28;
    const ph = t.phase||0, tm = animTime;
    const moving = t.state==='moving';
    const bob = moving ? Math.sin(tm*6+ph)*1.8 : 0;
    ctx.save();
    ctx.translate(t.px, t.py+bob);
    // Berserk glow
    if (G.berserkTimer>0){ctx.shadowColor='#ff1744';ctx.shadowBlur=8;}
    // Body (facing right toward zombies)
    switch(t.typeId) {
      case 'INFANTRY':{
        ctx.fillStyle='#2a5a2a';ctx.beginPath();ctx.ellipse(0,0,r*.45,r*.7,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#3a7a3a';ctx.beginPath();ctx.arc(0,-r*.75,r*.35,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1e3e1e';ctx.beginPath();ctx.arc(0,-r*.78,r*.28,Math.PI,0);ctx.fill();
        // rifle right
        ctx.fillStyle='#555';ctx.fillRect(r*.2,-r*.1,r*.8,r*.1);
        if(t._hit){ctx.fillStyle='#ffcc00';ctx.shadowColor='#ffcc00';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(r*1.02,-r*.05,r*.12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
        // legs
        const lg=moving?Math.sin(tm*6+ph)*.3:0;
        ctx.strokeStyle='#1e3e1e';ctx.lineWidth=r*.22;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.15,r*.5);ctx.lineTo(-r*.2+lg*r*.5,r+Math.abs(lg)*r*.2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.15,r*.5);ctx.lineTo(r*.2-lg*r*.5,r+Math.abs(lg)*r*.2);ctx.stroke();
        break;}
      case 'RANGER':{
        ctx.fillStyle='#6a3a1a';ctx.beginPath();ctx.ellipse(0,0,r*.4,r*.65,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.arc(0,-r*.72,r*.32,0,Math.PI*2);ctx.fill();
        // bow
        ctx.strokeStyle='#8a5a1a';ctx.lineWidth=r*.1;ctx.beginPath();ctx.arc(r*.3,-r*.1,r*.5,-Math.PI*.7,Math.PI*.7);ctx.stroke();
        ctx.strokeStyle='#ccaa55';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(r*.3,-r*.45);ctx.lineTo(r*.3,r*.25);ctx.stroke();
        if(t._hit){ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.moveTo(r*.3,-r*.1);ctx.lineTo(r*2.5,-r*.1);ctx.strokeStyle='#ffaa00';ctx.lineWidth=1.5;ctx.stroke();}
        const lg2=moving?Math.sin(tm*6+ph)*.3:0;
        ctx.strokeStyle='#6a3a1a';ctx.lineWidth=r*.2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.12,r*.45);ctx.lineTo(-r*.18+lg2*r*.5,r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.12,r*.45);ctx.lineTo(r*.18-lg2*r*.5,r);ctx.stroke();
        break;}
      case 'MEDIC_U':{
        ctx.fillStyle='#cccccc';ctx.beginPath();ctx.ellipse(0,0,r*.43,r*.65,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#eeeeee';ctx.beginPath();ctx.arc(0,-r*.72,r*.32,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#dd1111';ctx.fillRect(-r*.08,-r*.18,r*.16,r*.36);ctx.fillRect(-r*.18,-r*.08,r*.36,r*.16);
        ctx.strokeStyle='#44ff4488';ctx.lineWidth=1;ctx.setLineDash([2,2]);
        ctx.beginPath();ctx.arc(0,0,r*(1.2+Math.sin(tm*3+ph)*.15),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        const lg3=moving?Math.sin(tm*5+ph)*.25:0;
        ctx.strokeStyle='#aaa';ctx.lineWidth=r*.2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.12,r*.45);ctx.lineTo(-r*.15+lg3*r*.4,r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.12,r*.45);ctx.lineTo(r*.15-lg3*r*.4,r);ctx.stroke();
        break;}
      case 'TANK_U':{
        // Tank body
        ctx.fillStyle='#5a5a5a';ctx.fillRect(-r*.7,-r*.55,r*1.4,r*.9);
        ctx.fillStyle='#777';ctx.fillRect(-r*.55,-r*.45,r*1.1,r*.7);
        // turret
        ctx.fillStyle='#444';ctx.beginPath();ctx.arc(0,-r*.15,r*.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#333';ctx.fillRect(0,-r*.2,r*.9,r*.1);
        if(t._hit){ctx.fillStyle='#ff8800';ctx.shadowColor='#ff8800';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(r*.95,-r*.15,r*.18,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
        // treads
        ctx.fillStyle='#333';
        const treadOff=moving?(animTime*40)%r*.4:0;
        for(let i=0;i<4;i++){ctx.fillRect(-r*.7+i*r*.35+treadOff%r*.35,r*.35,r*.25,r*.18);}
        break;}
      case 'COMMANDO':{
        ctx.fillStyle='#3a1a4a';ctx.beginPath();ctx.ellipse(0,0,r*.38,r*.62,-0.15,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#5a2a6a';ctx.beginPath();ctx.arc(r*.05,-r*.7,r*.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#222';ctx.fillRect(r*.2,-r*.12,r*.7,r*.08);
        if(t._hit){ctx.fillStyle='#ff4400';ctx.shadowColor='#ff4400';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(r*.92,-r*.08,r*.1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
        const lg4=moving?Math.sin(tm*9+ph)*.4:0;
        ctx.strokeStyle='#3a1a4a';ctx.lineWidth=r*.18;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.12,r*.45);ctx.lineTo(-r*.2+lg4*r*.6,r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.12,r*.45);ctx.lineTo(r*.2-lg4*r*.6,r);ctx.stroke();
        break;}
      case 'ROCKET':{
        ctx.fillStyle='#7a2200';ctx.beginPath();ctx.ellipse(0,0,r*.42,r*.65,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#aa3300';ctx.beginPath();ctx.arc(0,-r*.7,r*.32,0,Math.PI*2);ctx.fill();
        // rocket launcher
        ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(r*.55,-r*.1,r*.55,r*.16,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(r*1.1,-r*.1,r*.1,r*.12,0,0,Math.PI*2);ctx.fill();
        if(t._hit){ctx.fillStyle='#ff6600';ctx.shadowColor='#ff6600';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(r*1.25,-r*.1,r*.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
        const lg5=moving?Math.sin(tm*5+ph)*.25:0;
        ctx.strokeStyle='#7a2200';ctx.lineWidth=r*.2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.12,r*.45);ctx.lineTo(-r*.15+lg5*r*.4,r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.12,r*.45);ctx.lineTo(r*.15-lg5*r*.4,r);ctx.stroke();
        break;}
      case 'ENGINEER_AUTO':{
        // Yellow/orange worker with wrench
        ctx.fillStyle='#cc8800';ctx.beginPath();ctx.ellipse(0,0,r*.4,r*.62,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(0,-r*.7,r*.3,0,Math.PI*2);ctx.fill();
        // hard hat
        ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,-r*.9,r*.3,Math.PI,0);ctx.fill();
        ctx.fillStyle='#cc8800';ctx.fillRect(-r*.32,-r*.9,r*.64,r*.1);
        // wrench animation
        const wr=moving?Math.sin(tm*5+ph)*.4:Math.sin(tm*3+ph)*.2;
        ctx.save();ctx.translate(r*.5,-r*.1);ctx.rotate(wr);
        ctx.fillStyle='#888';ctx.fillRect(0,-r*.07,r*.65,r*.14);
        ctx.beginPath();ctx.arc(0,0,r*.14,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(r*.65,0,r*.14,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // repair glow when working
        if(t._hit){ctx.strokeStyle='#39ff14';ctx.lineWidth=1.5;ctx.shadowColor='#39ff14';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(0,0,r*1.3,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}
        const lge=moving?Math.sin(tm*6+ph)*.3:0;
        ctx.strokeStyle='#cc8800';ctx.lineWidth=r*.2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-r*.12,r*.45);ctx.lineTo(-r*.18+lge*r*.5,r);ctx.stroke();
        ctx.beginPath();ctx.moveTo(r*.12,r*.45);ctx.lineTo(r*.18-lge*r*.5,r);ctx.stroke();
        break;}
    }
    ctx.shadowBlur=0;
    // HP bar
    const bw=r*2.2, bh=3;
    ctx.fillStyle='#111';ctx.fillRect(-bw/2,-r-8,bw,bh);
    const hpR=t.hp/t.maxHp;
    ctx.fillStyle=hpR>.5?'#39ff14':hpR>.25?'#ffaa00':'#ff1744';
    ctx.fillRect(-bw/2,-r-8,bw*hpR,bh);
    ctx.restore();
    t._hit=Math.max(0,(t._hit||0)-.05);
  }
}

function updateTroops(dt) {
  const dead=[];
  for(let i=0;i<G.troops.length;i++){
    const t=G.troops[i];
    if(t.hp<=0){dead.push(i);continue;}
    const mu=MOBILE_UNITS[t.typeId];
    // Healer: heal nearby troops
    if(mu.healer){
      t.healCd=(t.healCd||0)-dt;
      if(t.healCd<=0){
        t.healCd=1;
        for(const t2 of G.troops) if(t2.id!==t.id&&t2.hp>0&&Math.hypot(t2.px-t.px,t2.py-t.py)<mu.healRange*CELL) t2.hp=Math.min(t2.maxHp,t2.hp+mu.healAmt);
      }
      // Follow nearest ally
      let nearA=null,nearAD=Infinity;
      for(const t2 of G.troops) if(t2.id!==t.id&&t2.hp>0){const d=Math.hypot(t2.px-t.px,t2.py-t.py);if(d<nearAD){nearAD=d;nearA=t2;}}
      if(nearA&&nearAD>CELL*.8){const a=Math.atan2(nearA.py-t.py,nearA.px-t.px);t.px+=Math.cos(a)*mu.speed*dt;t.py+=Math.sin(a)*mu.speed*dt;}
      t.state='moving';continue;
    }
    // Repairer: finds nearest damaged building and repairs it
    if(mu.repairer){
      t.repairCd=(t.repairCd||0)-dt;
      const repRng=mu.repairRange*CELL;
      let bestB=null,bestBDist=Infinity,bestBPos=null;
      for(const bId in G.buildings){
        const b=G.buildings[bId];
        if(b.hp>=b.maxHp) continue;
        const bx=(b.col+.5)*CELL,by=(b.row+.5)*CELL;
        const d=Math.hypot(bx-t.px,by-t.py);
        if(d<bestBDist){bestBDist=d;bestB=b;bestBPos={x:bx,y:by};}
      }
      if(bestB&&bestBDist<=repRng){
        t.state='attacking';
        if(t.repairCd<=0){t.repairCd=1;bestB.hp=Math.min(bestB.maxHp,bestB.hp+mu.repairAmt);t._hit=0.3;addEffect({type:'chain',x1:t.px,y1:t.py,x2:bestBPos.x,y2:bestBPos.y,alpha:.5,life:.2});}
      } else if(bestB){
        t.state='moving';
        const a=Math.atan2(bestBPos.y-t.py,bestBPos.x-t.px);t.px+=Math.cos(a)*mu.speed*dt;t.py+=Math.sin(a)*mu.speed*dt;
      } else {
        t.state='idle';
      }
      t.px=Math.max(CELL*.5,Math.min(t.px,(SPAWN_COL-.5)*CELL));
      t.py=Math.max(CELL*.5,Math.min(t.py,(ROWS-.5)*CELL));
      continue;
    }
    // Find nearest zombie
    let nz=null,nzd=Infinity;
    for(const zId in G.zombies){const z=G.zombies[zId];if(!z.spawned)continue;const d=Math.hypot(z.px-t.px,z.py-t.py);if(d<nzd){nzd=d;nz=z;}}
    const rng=(mu.range||1.5)*CELL;
    t.cooldown=(t.cooldown||0)-dt;
    if(nz&&nzd<=rng){
      t.state='attacking';
      if(t.cooldown<=0){
        t.cooldown=1/(mu.rate||1);
        t._hit=0.4;
        const dmg = Math.ceil(mu.dmg * getTroopMult(t.typeId));
        if(mu.aoe){
          addEffect({type:'explosion',px:nz.px,py:nz.py,radius:CELL*1.8,alpha:.8,life:.35});
          for(const zId in G.zombies){const z2=G.zombies[zId];if(!z2.spawned)continue;if(Math.hypot(z2.px-nz.px,z2.py-nz.py)<CELL*1.8){z2.hp-=dmg;if(z2.hp<=0)killZombie(z2);}}
        } else if(mu.ranged){
          G.projectiles.push({px:t.px,py:t.py,tx:nz.px,ty:nz.py,targetId:nz.id,dmg,color:'#ffcc44',size:2.5,speed:600});
        } else {
          nz.hp-=dmg; if(nz.hp<=0)killZombie(nz);
          addEffect({type:'chain',x1:t.px,y1:t.py,x2:nz.px,y2:nz.py,alpha:.6,life:.12});
        }
      }
    } else {
      t.state='moving';
      if(nz){const a=Math.atan2(nz.py-t.py,nz.px-t.px);t.px+=Math.cos(a)*mu.speed*dt;t.py+=Math.sin(a)*mu.speed*dt;}
      else{t.px+=mu.speed*dt;}
      t.px=Math.min(t.px,(SPAWN_COL-.5)*CELL);
      t.py=Math.max(CELL*.5,Math.min(t.py,(ROWS-.5)*CELL));
    }
  }
  for(let i=dead.length-1;i>=0;i--) G.troops.splice(dead[i],1);
}

function getTroopLevel(typeId) { return G.troopLevels[typeId] || 1; }
function getTroopMult(typeId)  { return 1 + (getTroopLevel(typeId) - 1) * 0.25; } // +25% per level

function upgradeTroopType(typeId) {
  const mu = MOBILE_UNITS[typeId];
  const lvl = getTroopLevel(typeId);
  const cost = { gold: Math.ceil(mu.cost.gold * 1.8 * Math.pow(lvl, 1.3)) };
  if (mu.cost.scrap) cost.scrap = Math.ceil(mu.cost.scrap * 1.8 * Math.pow(lvl, 1.3));
  if (!canAfford(cost)) { setMsg(`❌ Besoin ${Object.entries(cost).map(([k,v])=>resIcon(k)+v).join(' ')} !`); return; }
  spendResources(cost);
  G.troopLevels[typeId] = lvl + 1;
  // Boost already-deployed troops of this type
  const m = getTroopMult(typeId);
  for (const t of G.troops) if (t.typeId === typeId) { t.maxHp = Math.ceil(mu.hp * m); t.hp = Math.min(t.hp + Math.ceil(mu.hp * 0.25), t.maxHp); }
  setMsg(`⬆ ${mu.name} amélioré Niv.${lvl+1} — HP & DMG +25% !`);
  updateTopBar();
  updateBuildList();
}

function spawnTroop(typeId, col, row) {
  const mu=MOBILE_UNITS[typeId];
  if(!mu)return false;
  if(!canAfford(mu.cost)){setMsg('❌ Ressources insuffisantes !');return false;}
  spendResources(mu.cost);
  const m = getTroopMult(typeId);
  const id=G.nextTroopId++;
  G.troops.push({id,typeId,hp:Math.ceil(mu.hp*m),maxHp:Math.ceil(mu.hp*m),
    px:Math.max(CELL*.5,(col-.1)*CELL),py:(row+.5)*CELL,
    state:'moving',cooldown:0,phase:Math.random()*Math.PI*2,_hit:0});
  updateTopBar();
  return true;
}
