<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Energy Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=Saira+Condensed:wght@700;800;900&display=swap">
<style>
/* Layout : scène fixe 1920×1080 mise à l'échelle — historique à gauche, roue au centre, compteur + commandes à droite */
:root {
  --ink: #04050e;
  --night: #0a0e2c;
  --volt: #2de2ff;
  --violet: #8b3dff;
  --crimson: #ff2e4d;
  --gold: #ffc93c;
  --gold-hi: #fff1b8;
  --gold-lo: #8a5e12;
  --paper: #f2f0ff;
  --muted: #9aa3d1;
  --panel: rgba(9, 11, 34, 0.8);
  --line: rgba(120, 140, 255, 0.22);
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-label: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-jp: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#viewport { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 56%, rgba(70, 40, 190, 0.55), transparent 70%),
    radial-gradient(ellipse 40% 30% at 12% 10%, rgba(255, 46, 77, 0.22), transparent 70%),
    radial-gradient(ellipse 40% 30% at 88% 12%, rgba(45, 226, 255, 0.18), transparent 70%),
    linear-gradient(180deg, #070a24 0%, #0d0a2e 45%, #120626 70%, #04050e 100%);
}

/* ---------- Décor ---------- */
.layer { position: absolute; inset: 0; pointer-events: none; }
.sun {
  position: absolute; left: 50%; top: 600px; width: 1340px; height: 1340px; margin: -670px 0 0 -670px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 201, 60, 0.0) 36%, rgba(255, 90, 60, 0.16) 44%, rgba(160, 40, 200, 0.12) 56%, transparent 68%);
}
.sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.floor {
  position: absolute; left: -10%; right: -10%; bottom: -60px; height: 430px;
  transform: perspective(520px) rotateX(62deg); transform-origin: 50% 100%;
  background:
    linear-gradient(180deg, rgba(4, 5, 14, 1) 0%, rgba(4, 5, 14, 0) 40%),
    repeating-linear-gradient(90deg, rgba(45, 226, 255, 0.5) 0 2px, transparent 2px 90px),
    repeating-linear-gradient(0deg, rgba(139, 61, 255, 0.55) 0 2px, transparent 2px 90px);
  animation: floorRun 3.2s linear infinite;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 45%);
          mask-image: linear-gradient(180deg, transparent, #000 45%);
}
@keyframes floorRun { to { background-position: 0 0, 0 0, 0 90px; } }

.lantern { position: absolute; top: 0; width: 64px; transform-origin: 50% 0; animation: swing 5s ease-in-out infinite; }
.lantern::before { content: ""; display: block; width: 2px; height: var(--h, 40px); margin: 0 auto; background: linear-gradient(var(--gold-lo), var(--gold)); }
.lantern .lb {
  width: 64px; height: 86px; border-radius: 26px / 34px; position: relative;
  background: radial-gradient(ellipse at 50% 45%, #ff8a5c 0%, #e11d3f 45%, #7a0820 100%);
  box-shadow: 0 0 34px rgba(255, 60, 80, 0.75), inset 0 0 14px rgba(0, 0, 0, 0.45);
  display: grid; place-items: center; font-family: var(--f-jp); font-size: 30px; color: #2a0007;
}
.lantern .lb::before, .lantern .lb::after { content: ""; position: absolute; left: 14px; right: 14px; height: 8px; background: #1c1205; border-radius: 3px; }
.lantern .lb::before { top: -4px; } .lantern .lb::after { bottom: -4px; }
.lantern .lb span { position: relative; z-index: 1; text-shadow: 0 0 6px rgba(255, 200, 120, 0.6); }
@keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

/* Cartes holographiques flottantes */
.fcard {
  position: absolute; width: var(--w); height: calc(var(--w) * 1.4); border-radius: 10px;
  left: var(--x); top: var(--y); opacity: var(--o, 0.6); filter: blur(var(--b, 0px));
  animation: floatCard var(--d, 9s) ease-in-out infinite; animation-delay: var(--dl, 0s);
  transform: rotate(var(--r, 0deg));
}
.fcard .face {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  border: 5px solid #e9c25a; background: linear-gradient(150deg, var(--c2), var(--c) 45%, var(--c3));
  box-shadow: 0 0 30px rgba(140, 90, 255, 0.45), 0 16px 30px rgba(0, 0, 0, 0.5);
}
.fcard .face svg { position: absolute; width: 58%; left: 21%; top: 24%; }
.fcard .face::after, .holo-sheen {
  content: ""; position: absolute; inset: 0; mix-blend-mode: color-dodge; opacity: 0.75;
  background: linear-gradient(115deg, transparent 20%, rgba(255, 80, 200, 0.55) 32%, rgba(80, 210, 255, 0.55) 42%, rgba(140, 255, 140, 0.5) 52%, rgba(255, 240, 110, 0.5) 62%, transparent 74%);
  background-size: 300% 300%; animation: sheen 4s linear infinite;
}
@keyframes sheen { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
@keyframes floatCard {
  0%, 100% { transform: translateY(0) rotate(var(--r)) rotateY(0deg); }
  50% { transform: translateY(-26px) rotate(calc(var(--r) + 5deg)) rotateY(18deg); }
}

canvas.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* ---------- Titre ---------- */
.title { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); text-align: center; white-space: nowrap; z-index: 5; }
.t-eyebrow { font-family: var(--f-label); font-weight: 800; letter-spacing: 0.5em; font-size: 20px; color: var(--volt); text-shadow: 0 0 12px rgba(45, 226, 255, 0.8); padding-left: 0.5em; }
.title h1 {
  margin: 2px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 84px; line-height: 0.95; letter-spacing: 0.02em;
  background: linear-gradient(180deg, #fffbe6 0%, var(--gold) 46%, #e07a12 54%, #ffd35a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #5a2a00) drop-shadow(0 0 18px rgba(255, 160, 40, 0.55));
}
.t-jp { font-family: var(--f-jp); font-size: 22px; letter-spacing: 0.4em; color: #ff7a8e; text-shadow: 0 0 10px rgba(255, 46, 77, 0.7); padding-left: 0.4em; margin-top: 6px; }

/* ---------- Roue ---------- */
.wheel-wrap { position: absolute; left: 575px; top: 215px; width: 770px; height: 770px; z-index: 4; }
.wheel-halo {
  position: absolute; inset: -46px; border-radius: 50%;
  background: conic-gradient(from 0deg, #2de2ff, #8b3dff, #ff2e4d, #ffc93c, #2fb44a, #2de2ff);
  filter: blur(34px); opacity: 0.55; animation: halo 8s linear infinite;
}
.wheel-wrap.spinning .wheel-halo { animation-duration: 1.4s; opacity: 0.85; }
@keyframes halo { to { transform: rotate(360deg); } }
.wheel-base { position: absolute; left: 50%; bottom: -70px; width: 980px; height: 150px; margin-left: -490px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(45, 226, 255, 0.45), rgba(139, 61, 255, 0.2) 45%, transparent 70%); }
#wheel { position: absolute; inset: 0; width: 770px; height: 770px; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.6)); }
.pointer { position: absolute; left: 50%; top: -42px; width: 96px; height: 125px; margin-left: -48px; transform-origin: 50% 32%; z-index: 3; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 14px rgba(255, 201, 60, 0.55)); }
.hub {
  position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 0; cursor: pointer; z-index: 2;
  background: radial-gradient(circle at 38% 30%, #3b3f86 0%, #141638 55%, #06061a 100%);
  box-shadow: 0 0 0 7px #e5b23b, 0 0 0 11px #5a3a08, 0 0 30px rgba(45, 226, 255, 0.7), inset 0 0 26px rgba(45, 226, 255, 0.45);
  display: grid; place-items: center; transition: transform 0.15s;
}
.hub:hover:not(:disabled) { transform: scale(1.05); }
.hub:disabled { cursor: default; }
.hub:focus-visible { outline: 4px solid var(--volt); outline-offset: 10px; }
.hub .hub-jp { font-family: var(--f-jp); font-size: 40px; color: var(--gold); text-shadow: 0 0 14px rgba(255, 201, 60, 0.9); line-height: 1; }
.hub .hub-txt { font-family: var(--f-label); font-weight: 900; font-size: 17px; letter-spacing: 0.18em; color: var(--volt); margin-top: 4px; }
.hub-inner { display: grid; justify-items: center; }
.hub::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 2px dashed rgba(45, 226, 255, 0.55); animation: halo 10s linear infinite; }
.wheel-wrap.spinning .hub::after { animation-duration: 0.8s; }
.wheel-wrap.resetting { animation: resetPop 0.6s ease-out; }
@keyframes resetPop { 0% { transform: scale(1); filter: brightness(1); } 30% { transform: scale(0.94); filter: brightness(2.2) saturate(0.4); } 100% { transform: scale(1); filter: brightness(1); } }

.plate {
  position: absolute; left: 50%; top: 1000px; transform: translateX(-50%); z-index: 5; min-width: 360px; padding: 6px 30px 8px;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(180deg, rgba(20, 16, 60, 0.95), rgba(8, 8, 26, 0.95)); border: 2px solid rgba(255, 201, 60, 0.7); border-radius: 999px;
  box-shadow: 0 0 22px rgba(139, 61, 255, 0.5);
  font-family: var(--f-label); font-weight: 900; font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--plate, #fff); text-shadow: 0 0 14px var(--plate, #fff);
}
.plate small { font-size: 15px; letter-spacing: 0.3em; color: var(--muted); text-shadow: none; font-weight: 800; }

/* ---------- Panneaux ---------- */
.panel {
  position: absolute; top: 205px; width: 420px; height: 840px; z-index: 5; padding: 22px 24px;
  background: linear-gradient(180deg, rgba(14, 16, 48, 0.88), rgba(7, 8, 24, 0.9));
  border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  display: flex; flex-direction: column; gap: 14px;
}
.panel::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(160deg, rgba(45, 226, 255, 0.7), transparent 35%, transparent 65%, rgba(255, 46, 77, 0.6));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.panel-left { left: 48px; }
.panel-right { right: 48px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: 0.04em; color: var(--paper); }
.panel-head .jp { font-family: var(--f-jp); font-size: 20px; color: var(--crimson); letter-spacing: 0.2em; }

.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.hrow {
  display: grid; grid-template-columns: 76px 44px 1fr; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 10px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(154, 163, 209, 0.2);
}
.hrow .hnum { font-family: var(--f-label); font-weight: 800; font-size: 16px; white-space: nowrap; letter-spacing: 0.12em; color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow .hb { width: 42px; height: 42px; }
.hrow .hb svg { width: 100%; height: 100%; display: block; }
.hrow .hname { font-family: var(--f-label); font-weight: 800; font-size: 25px; letter-spacing: 0.03em; color: rgba(154, 163, 209, 0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow.filled { border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 42%, transparent), rgba(255, 255, 255, 0.02) 85%); }
.hrow.filled .hnum { color: var(--paper); }
.hrow.filled .hname { color: #fff; text-shadow: 0 0 12px color-mix(in srgb, var(--c) 80%, transparent), 0 2px 0 rgba(0, 0, 0, 0.5); }
.hrow.latest { animation: rowIn 0.7s cubic-bezier(.2, 1.4, .4, 1); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 60%, transparent); }
@keyframes rowIn { from { transform: translateX(-40px) scale(0.9); opacity: 0; filter: brightness(2.5); } to { transform: none; opacity: 1; filter: none; } }

.counter { text-align: center; padding: 4px 0 12px; border-bottom: 1px solid var(--line); }
.count-num { font-family: var(--f-display); font-size: 92px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; justify-content: center; align-items: baseline; gap: 8px; }
.count-num #countNum { color: var(--gold); text-shadow: 0 0 26px rgba(255, 201, 60, 0.7), 0 4px 0 #6a3d00; display: inline-block; }
.count-num #countNum.bump { animation: bump 0.6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 0% { transform: scale(1.8); filter: brightness(2); } 100% { transform: scale(1); } }
.count-num .of { font-size: 48px; color: var(--muted); }
.count-label { font-family: var(--f-label); font-weight: 900; font-size: 26px; letter-spacing: 0.16em; color: var(--paper); margin-top: 6px; }
.pips { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; margin-top: 12px; }
.pips i { height: 10px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); }
.pips i.on { background: var(--c); box-shadow: 0 0 10px var(--c); }
.count-left { font-family: var(--f-label); font-weight: 700; font-size: 19px; letter-spacing: 0.08em; color: var(--muted); margin-top: 10px; }

.grid-head { font-family: var(--f-label); font-weight: 900; font-size: 17px; letter-spacing: 0.3em; color: var(--muted); display: flex; justify-content: space-between; }
.egrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.ecell { position: relative; display: grid; justify-items: center; gap: 2px; transition: opacity 0.4s, filter 0.4s; }
.ecell svg { width: 60px; height: 60px; display: block; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--c) 70%, transparent)); }
.ecell span { font-family: var(--f-label); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: var(--paper); white-space: nowrap; }
.ecell.out { opacity: 0.28; filter: grayscale(1); }
.ecell .ord { position: absolute; top: -4px; right: 6px; font-family: var(--f-display); font-size: 14px; color: var(--gold); display: none; opacity: 1; }
.ecell.out .ord { display: block; }
.ecell.out::after { content: ""; position: absolute; left: 50%; top: 30px; width: 70px; height: 4px; margin-left: -35px; background: var(--crimson); transform: rotate(-35deg); border-radius: 2px; }

.controls { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.btn { border: 0; cursor: pointer; border-radius: 14px; font-family: var(--f-display); letter-spacing: 0.04em; position: relative; overflow: hidden; transition: transform 0.12s, filter 0.2s, opacity 0.2s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
.btn:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
.btn:disabled { cursor: not-allowed; filter: grayscale(0.85) brightness(0.6); }
.btn-spin {
  height: 86px; font-size: 30px; color: #3a1d00;
  background: linear-gradient(180deg, #fff6c8 0%, var(--gold) 40%, #f09a14 100%);
  box-shadow: 0 6px 0 #8a4b00, 0 0 34px rgba(255, 201, 60, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.7);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
}
.btn-spin:not(:disabled)::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.75), transparent); animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
.btn-reset { height: 60px; font-size: 21px; color: #fff; background: linear-gradient(180deg, #ff5a73, var(--crimson) 50%, #a3001c); box-shadow: 0 5px 0 #5c0010, 0 0 22px rgba(255, 46, 77, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.35); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-small { height: 54px; font-family: var(--f-label); font-weight: 900; font-size: 19px; letter-spacing: 0.1em; color: var(--paper); background: linear-gradient(180deg, #2a2f72, #141640); box-shadow: 0 4px 0 #07081e, inset 0 0 0 1px rgba(45, 226, 255, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-small svg { width: 22px; height: 22px; }
.btn-small[aria-pressed="false"] { color: var(--muted); }
.keys { font-family: var(--f-label); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; color: var(--muted); text-align: center; }
.keys b { color: var(--paper); border: 1px solid rgba(154, 163, 209, 0.4); border-radius: 4px; padding: 0 5px; font-weight: 800; }

/* ---------- Flash + révélation ---------- */
#flash { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, var(--c, #fff) 35%, transparent 75%); }
#flash.go { animation: flash 0.7s ease-out; }
@keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }

.reveal { position: absolute; inset: 0; z-index: 21; display: grid; place-items: center; cursor: pointer; background: radial-gradient(circle at 50% 52%, rgba(10, 6, 30, 0.55), rgba(2, 2, 10, 0.88) 70%); animation: fadeIn 0.3s ease-out; }
.reveal.out { animation: fadeOut 0.4s ease-in forwards; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; transform: scale(1.04); } }
.rays { position: absolute; left: 50%; top: 540px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--c) 55%, transparent) 0deg 7deg, transparent 7deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 62%); mask-image: radial-gradient(circle, #000 10%, transparent 62%);
  animation: halo 16s linear infinite; }
.shock { position: absolute; left: 50%; top: 520px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; border: 10px solid var(--c2); box-shadow: 0 0 40px var(--c); animation: shock 1s ease-out forwards; opacity: 0; }
.shock.s2 { animation-delay: 0.18s; }
@keyframes shock { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(9); opacity: 0; } }
.rv-stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.rv-banner {
  font-family: var(--f-display); font-size: 58px; letter-spacing: 0.03em; color: #fff; padding: 8px 40px 10px; border-radius: 12px; white-space: nowrap;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, #000), color-mix(in srgb, var(--c3) 90%, #000));
  border: 3px solid var(--gold); box-shadow: 0 0 40px var(--c), 0 8px 0 rgba(0, 0, 0, 0.5); text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
  animation: slam 0.55s cubic-bezier(.2, 1.5, .4, 1) both; transform: skewX(-8deg);
}
@keyframes slam { 0% { transform: skewX(-8deg) scale(3); opacity: 0; filter: blur(10px); } 100% { transform: skewX(-8deg) scale(1); opacity: 1; filter: none; } }
.card-wrap { animation: cardIn 1.1s cubic-bezier(.2, 1, .3, 1) both; animation-delay: 0.1s; perspective: 1400px; }
@keyframes cardIn { 0% { transform: rotateY(-720deg) scale(0.15); opacity: 0; } 60% { opacity: 1; } 80% { transform: rotateY(12deg) scale(1.06); } 100% { transform: rotateY(0) scale(1); opacity: 1; } }
.holo-card {
  position: relative; width: 360px; height: 500px; border-radius: 24px; padding: 12px; animation: tilt 4s ease-in-out infinite 1.2s;
  background: linear-gradient(135deg, #fff6c8, #d9a632 25%, #fff1b8 50%, #b8861b 75%, #fff6c8);
  box-shadow: 0 0 60px var(--c), 0 0 120px color-mix(in srgb, var(--c) 50%, transparent), 0 30px 60px rgba(0, 0, 0, 0.6);
}
@keyframes tilt { 0%, 100% { transform: rotateY(-8deg) rotateX(4deg); } 50% { transform: rotateY(8deg) rotateX(-4deg); } }
.hc-inner { position: relative; height: 100%; border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(160deg, var(--c2), var(--c) 45%, var(--c3)); }
.hc-inner::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255, 255, 255, 0.16) 0 6deg, transparent 6deg 15deg); }
.hc-inner::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.85) 1px, transparent 1.6px); background-size: 22px 22px; mix-blend-mode: overlay; opacity: 0.6; }
.hc-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0, 0, 0, 0.35); }
.hc-top .tour { font-family: var(--f-label); font-weight: 900; font-size: 22px; letter-spacing: 0.16em; color: #fff; }

@keyframes egIn { from { transform: translateY(40px) rotateY(90deg); opacity: 0; } }
.eg-card .in { position: relative; height: 100%; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, var(--c2), var(--c) 50%, var(--c3)); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; }

<script>
(() => {
'use strict';

/* =========================================================
   DONNÉES — les 12 énergies
   ========================================================= */
const RAINBOW = ['#ff4d4d', '#ffb84d', '#fff04d', '#5dff7a', '#4dc3ff', '#b84dff', '#ff4dd2'];
const ENERGIES = [
  { id: 'grass',     name: 'Plante',     color: '#2fb44a', dark: '#0f5420', light: '#9cf08a', text: '#ffffff', glyph: '#ffffff', kanji: '草' },
  { id: 'fire',      name: 'Feu',        color: '#ee3b24', dark: '#6e1006', light: '#ffab6e', text: '#ffffff', glyph: '#ffffff', kanji: '炎' },
  { id: 'water',     name: 'Eau',        color: '#1f86ee', dark: '#0a3574', light: '#8fd8ff', text: '#ffffff', glyph: '#ffffff', kanji: '水' },
  { id: 'lightning', name: 'Électrique', color: '#ffd21a', dark: '#a86f00', light: '#fff6b0', text: '#2a1a00', glyph: '#2a1a00', kanji: '雷' },
  { id: 'psychic',   name: 'Psy',        color: '#b04bea', dark: '#46106b', light: '#ecb2ff', text: '#ffffff', glyph: '#ffffff', kanji: '超' },
  { id: 'fighting',  name: 'Combat',     color: '#d0702a', dark: '#5e2808', light: '#ffbf85', text: '#ffffff', glyph: '#ffffff', kanji: '闘' },
  { id: 'darkness',  name: 'Obscurité',  color: '#3a3456', dark: '#0c0a18', light: '#8a82bd', text: '#ffffff', glyph: '#e9e4ff', kanji: '悪' },
  { id: 'metal',     name: 'Métal',      color: '#a7b3c0', dark: '#45515e', light: '#f2f6fa', text: '#18202a', glyph: '#26303b', kanji: '鋼' },
  { id: 'dragon',    name: 'Dragon',     color: '#c49a2c', dark: '#4e3805', light: '#f7dc85', text: '#ffffff', glyph: '#ffffff', kanji: '竜' },
  { id: 'fairy',     name: 'Fée',        color: '#f37bc0', dark: '#86205c', light: '#ffd0ea', text: '#4a0d32', glyph: '#ffffff', kanji: '妖' },
  { id: 'colorless', name: 'Incolore',   color: '#e8e4d6', dark: '#837e6a', light: '#ffffff', text: '#2b2a24', glyph: '#3a382e', kanji: '無' },
  { id: 'special',   name: 'Spéciale',   color: '#ff47c8', dark: '#3d1780', light: '#ffe86b', text: '#ffffff', glyph: '#ffffff', kanji: '特', rainbow: true },
];
/* =========================================================
   VOS VISUELS — déposez vos images dans le dossier « visuels/ »
   Un fichier absent est simplement ignoré (le décor par défaut reste).
   ========================================================= */
const VISUELS = {
  fond: 'visuels/fond.jpg',                 // image d'arrière-plan 1920×1080
  logo: 'visuels/logo.png',                 // remplace le titre « ENERGY ROULETTE » (PNG transparent)
  // personnages / mascottes autour de la roue (PNG transparents) — x, y, hauteur en pixels sur la scène 1920×1080
  mascottes: [
    { src: 'visuels/mascotte1.png', x: 455, y: 640, h: 380 },
    { src: 'visuels/mascotte2.png', x: 1215, y: 640, h: 380, miroir: true },
    { src: 'visuels/mascotte3.png', x: 470, y: 190, h: 220 },
    { src: 'visuels/mascotte4.png', x: 1260, y: 190, h: 220, miroir: true },
  ],
  // cartes flottantes : visuels de cartes / boosters (ratio carte 5:7)
  cartes: ['visuels/carte1.png', 'visuels/carte2.png', 'visuels/carte3.png', 'visuels/carte4.png',
           'visuels/carte5.png', 'visuels/carte6.png', 'visuels/carte7.png', 'visuels/carte8.png'],
};
function tryImage(src, ok) { if (!src) return; const im = new Image(); im.onload = () => ok(im); im.src = src; }

const BY_ID = Object.fromEntries(ENERGIES.map(e => [e.id, e]));
const fullName = e => 'Énergie ' + e.name;

/* =========================================================
   ICÔNES — symboles originaux (SVG) réutilisés en DOM et sur le canvas
   ========================================================= */
function star5(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
const SPARKLE = 'M50 4 C54 36 64 46 96 50 C64 54 54 64 50 96 C46 64 36 54 4 50 C36 46 46 36 50 4Z';
const GLYPHS = {
  grass: (g, c) => `<path fill="${g}" d="M50 8 C77 23 86 58 54 89 C51 92 49 92 46 89 C14 58 23 23 50 8Z"/><path d="M50 22 V84 M50 44 L63 33 M50 61 L66 49 M50 61 L34 49 M50 44 L37 33" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
  fire: (g, c) => `<path fill="${g}" d="M53 5 C57 25 77 34 79 58 C81 79 66 94 50 94 C33 94 20 81 22 62 C23 49 31 43 35 31 C40 42 44 47 48 49 C52 36 57 24 53 5Z"/><path fill="${c}" d="M50 55 C55 64 64 69 62 80 C61 86 56 89 50 89 C44 89 39 85 40 78 C41 70 47 66 50 55Z"/>`,
  water: (g, c) => `<path fill="${g}" d="M50 6 C61 30 81 46 81 65 C81 82 67 94 50 94 C33 94 19 82 19 65 C19 46 39 30 50 6Z"/><path d="M34 62 C33 73 40 81 50 82" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`,
  lightning: (g) => `<path fill="${g}" d="M60 3 L19 57 H45 L33 97 L82 37 H55 L69 3Z"/>`,
  psychic: (g, c) => `<path fill="${g}" d="M3 50 C22 18 78 18 97 50 C78 82 22 82 3 50Z"/><circle cx="50" cy="50" r="18" fill="${c}"/><circle cx="50" cy="50" r="7.5" fill="${g}"/>`,
  fighting: (g, c) => `<g fill="${g}"><rect x="19" y="21" width="16" height="28" rx="8"/><rect x="34" y="16" width="16" height="32" rx="8"/><rect x="50" y="16" width="16" height="32" rx="8"/><rect x="65" y="21" width="16" height="28" rx="8"/><rect x="19" y="36" width="62" height="38" rx="13"/><rect x="29" y="70" width="42" height="24" rx="5"/></g><path d="M34 34 V46 M50 32 V46 M66 34 V46" stroke="${c}" stroke-width="4" stroke-linecap="round"/><path d="M23 55 C34 50 46 52 53 63" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
  darkness: (g, c) => `<path fill="${g}" d="M64 7 A44 44 0 1 0 93 70 A37 37 0 0 1 64 7Z"/><path fill="${c}" d="M42 52 L58 46 L50 60Z"/>`,
  metal: (g) => `<path fill="${g}" fill-rule="evenodd" d="M50 5 L89 27 V73 L50 95 L11 73 V27Z M29 50 A21 21 0 1 0 71 50 A21 21 0 1 0 29 50Z"/><circle cx="50" cy="50" r="9" fill="${g}"/>`,
  dragon: (g) => `<g fill="${g}">${[0, 19, 38].map(d => `<path d="M${10 + d} 93 C${14 + d} 62 ${27 + d} 33 ${49 + d} 6 C${43 + d} 35 ${39 + d} 62 ${30 + d} 93Z"/>`).join('')}</g>`,
  fairy: (g) => `<path fill="${g}" d="${SPARKLE}"/><path fill="${g}" transform="translate(66 6) scale(.28)" d="${SPARKLE}"/><path fill="${g}" transform="translate(8 66) scale(.22)" d="${SPARKLE}"/>`,
  colorless: (g) => `<path fill="${g}" d="${star5(50, 53, 47, 19)}"/>`,
  special: (g) => `<circle cx="50" cy="50" r="33" fill="none" stroke="${g}" stroke-width="11"/><path fill="${g}" d="${star5(50, 51, 20, 8.5)}"/><g fill="${g}"><circle cx="50" cy="5" r="5"/><circle cx="95" cy="50" r="5"/><circle cx="50" cy="95" r="5"/><circle cx="5" cy="50" r="5"/></g>`,
};
let uid = 0;
function badgeSVG(e, size) {
  const id = 'b' + (++uid);
  const fill = e.rainbow
    ? `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${RAINBOW.map((c, i) => `<stop offset="${(i / (RAINBOW.length - 1)).toFixed(2)}" stop-color="${c}"/>`).join('')}</linearGradient>`
    : `<radialGradient id="${id}" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="${e.light}"/><stop offset=".55" stop-color="${e.color}"/><stop offset="1" stop-color="${e.dark}"/></radialGradient>`;
  const detail = e.rainbow ? e.dark : e.dark;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"${size ? ` width="${size}" height="${size}"` : ''}><defs>${fill}</defs>` +
    `<circle cx="60" cy="60" r="55" fill="url(#${id})" stroke="#ffffff" stroke-width="6"/>` +
    `<circle cx="60" cy="60" r="47" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>` +
    `<g transform="translate(23 23) scale(.74)">${GLYPHS[e.id](e.glyph, detail)}</g>` +
    `<ellipse cx="45" cy="32" rx="26" ry="12" fill="rgba(255,255,255,.22)"/></svg>`;
}
const badgeImg = {};
ENERGIES.forEach(e => {
  const img = new Image();
  img.onload = () => { segDirty = true; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(badgeSVG(e, 240));
  badgeImg[e.id] = img;
});

/* =========================================================
   HASARD — crypto.getRandomValues, tirage uniforme sans biais
   ========================================================= */
const cryptoOK = !!(window.crypto && crypto.getRandomValues);
function rand32() {
  if (cryptoOK) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
  return Math.floor(Math.random() * 0x100000000);
}
function randInt(n) {                       // entier uniforme dans [0, n)
  const limit = Math.floor(0x100000000 / n) * n;
  let x; do { x = rand32(); } while (x >= limit);
  return x % n;
}
const rand01 = () => rand32() / 0x100000000;
const rnd = (a, b) => a + Math.random() * (b - a);   // effets visuels uniquement
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =========================================================
   SON — synthèse WebAudio (aucun fichier externe)
   ========================================================= */
const Sound = {
  ctx: null, master: null, on: true, buf: null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate; this.buf = this.ctx.createBuffer(1, len, len);
        const d = this.buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (err) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  ok() { return this.on && this.ctx && this.ctx.state === 'running'; },
  osc(type, f, t, a, d, v, f2) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + a + d + 0.05);
  },
  noise(t, a, d, v, f1, f2, q = 1, type = 'bandpass') {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.buf; s.loop = true; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f1, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + a + d + 0.05);
  },
  tick(k) { if (!this.ok()) return; const t = this.ctx.currentTime; this.osc('square', 2100 + k * 500, t, 0.001, 0.035, 0.05 + 0.06 * k); this.noise(t, 0.001, 0.03, 0.12 + 0.1 * k, 3500, 0, 3); },

const bgc = $('bg').getContext('2d'), fxc = $('fx').getContext('2d');

function bolt(x1, y1, x2, y2, disp, depth = 6) {
  let pts = [[x1, y1], [x2, y2]];

    const np = [pts[0]];

}

  bgBolts.push({ pts: bolt(WC.x + Math.cos(a) * r0, WC.y + Math.sin(a) * r0, WC.x + Math.cos(a1) * r1, WC.y + Math.sin(a1) * r1, 60), col: col || pick(['#2de2ff', '#8b3dff', '#ffc93c']), w: rnd(1.5, 3), age: 0, life: rnd(0.18, 0.35) });
}

let wheelSpeed = 0;

  lightning: { shapes: ['star', 'glow'], colors: ['#fff7a0', '#ffd21a', '#ffffff'], g: 0, sp: [300, 1100], bolts: 26 },
  psychic:   { shapes: ['glow', 'ring', 'star'], colors: ['#ecb2ff', '#b04bea', '#ff7bd8'], g: -30, sp: [150, 520], swirl: 2.6 },

  darkness:  { shapes: ['smoke', 'glow', 'smoke'], colors: ['#8a82bd', '#5b3aa8', '#c6b8ff'], g: -40, sp: [100, 460], swirl: -1.8 },

  special:   { shapes: ['star', 'glow', 'glow'], colors: RAINBOW, g: 40, sp: [200, 820], swirl: 1.3, bolts: 10 },

let parts = [], fxBolts = [];
function burst(e, cx, cy, n, scale = 1) {
  const P = FX[e.id];
  for (let i = 0; i < n && parts.length < 1600; i++) {
    const a = rnd(0, TAU), v = rnd(P.sp[0], P.sp[1]) * scale, shape = pick(P.shapes);

  }

/* =========================================================
   LOGIQUE DE JEU
   ========================================================= */
// Profil de vitesse : accélération linéaire (10 %) puis décélération cubique — finit exactement à 1
const ACC = 0.1, AREA = ACC / 2 + (1 - ACC) / 4;
function spinEase(p) {
  if (p <= 0) return 0; if (p >= 1) return 1;
  if (p < ACC) return (p * p / (2 * ACC)) / AREA;
  return (ACC / 2 + (1 - ACC) / 4 * (1 - Math.pow((1 - p) / (1 - ACC), 4))) / AREA;
}

function spin() {
  Sound.init();
  if (phase === 'reveal') { closeReveal(); return; }
  if (phase !== 'idle' || remaining.length === 0 || spinAnim) return;
  layoutCache = computeLayout();
  const idx = randInt(remaining.length);                    // le tirage : uniforme parmi les énergies restantes
  const seg = layoutCache[idx];
  const target = seg.a0 + (seg.a1 - seg.a0) * (0.1 + 0.8 * rand01());   // point d'arrêt à l'intérieur de la case
  rot = mod(rot, TAU);
  const delta = mod(-target - rot, TAU);                     // angle exact pour amener la cible sous la flèche
  const turns = 6 + randInt(3);
  spinAnim = { from: rot, to: rot + delta + turns * TAU, start: performance.now(), dur: 6600 + randInt(1800), idx, slowed: false };
  phase = 'spinning';
  wheelWrap.classList.add('spinning');
  Sound.whoosh();
  updateUI();
}

function finishSpin() {
  const { idx } = spinAnim; spinAnim = null;
  rot = mod(rot, TAU);
  const winner = remaining[idx];
  const under = segAtPointer();
  if (!under || under.e.id !== winner.id) console.error('Désaccord animation/tirage', under && under.e.id, winner.id);
  remaining.splice(idx, 1);                                  // élimination réelle des données
  history.push(winner.id);
  removingSeg = { e: winner, index: idx, w: 1 };
  segDirty = true;
  phase = 'reveal'; revealShown = false;
  wheelWrap.classList.remove('spinning');
  Sound.stop();
  winFlashT = 1;
  updateUI(true);
  later(() => showReveal(winner), 650);
}

/* =========================================================
   BOUCLE D'ANIMATION
   ========================================================= */
const plateName = $('plateName'), plate = $('plate');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (spinAnim) {

    rot = spinAnim.from + (spinAnim.to - spinAnim.from) * spinEase(p);
    if (p > 0.72 && !spinAnim.slowed) { spinAnim.slowed = true; Sound.slow(); }
    if (p >= 1) { rot = spinAnim.to; finishSpin(); }
  }
  if (removeAnim) {
    const p = clamp((now - removeAnim.start) / removeAnim.dur, 0, 1);
    removingSeg.w = 1 - (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
    segDirty = true;
    if (p >= 1) finishRemove();
  }
  wheelSpeed = dt > 0 ? (rot - prevRot) / dt : 0;
  winFlashT = Math.max(0, winFlashT - dt * 2);

  if (segDirty) renderSegments();
  // cliquetis de la flèche à chaque changement de case
  const s = segAtPointer(), sid = s ? s.e.id + (s.removing ? '*' : '') : null;
  if (sid !== lastSegId) {
    if (phase === 'spinning' && lastSegId !== null) {
      Sound.tick(clamp(Math.abs(wheelSpeed) / 20, 0, 1));
      pointerVel -= 260 + Math.min(500, Math.abs(wheelSpeed) * 30);
    }
    lastSegId = sid;
    const e = s ? s.e : null;
    plateName.textContent = e ? fullName(e) : '—';
    plate.style.setProperty('--plate', e ? (e.rainbow ? '#ffe86b' : e.light) : '#fff');
  }
  pointerVel += (-pointerKick * 420 - pointerVel * 18) * dt;
  pointerKick = clamp(pointerKick + pointerVel * dt, -28, 4);
  pointerEl.style.transform = `rotate(${pointerKick.toFixed(2)}deg)`;

  drawBg(t, dt);
  drawWheel(t);
  if (phase === 'done' && !endEl.hidden) {
    fireworkT -= dt;
    if (fireworkT <= 0) { burst(pick(ENERGIES), rnd(260, 1660), rnd(140, 760), 70, 0.55); fireworkT = rnd(0.35, 0.8); }
  }
  drawFx(dt);

}

/* =========================================================

   ========================================================= */
function boot(data) {
