<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panier – PokéShop</title>
  <meta name="theme-color" content="#110c1b"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="page container">
  <span class="eyebrow">Ton sac</span>
  <h1 style="margin:12px 0 30px">Mon <span class="hl">panier</span></h1>

  <div id="empty-cart" class="empty panel hidden">
    <span class="ball"></span>
    <div class="dialog" style="max-width:440px;margin:12px auto 28px;text-align:left">Ton sac est vide !<br/>Aucun objet capturé pour le moment…</div>
    <a href="boutique.html" class="btn btn-yellow">Partir à l'aventure →</a>
  </div>

  <div id="cart-content" class="grid-cart hidden">
    <div class="stack" id="cart-items"></div>

    <aside class="panel stack" style="position:sticky;top:96px">
      <h3 style="font-size:1.3rem">Récapitulatif</h3>

      <div>
        <div class="row" style="gap:8px">
          <input id="promo-input" type="text" placeholder="Code promo" class="input" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')applyPromoCode()"/>
          <button onclick="applyPromoCode()" class="btn btn-sm">OK</button>
        </div>
        <p id="promo-result" class="small hidden" style="margin-top:6px;font-weight:800"></p>
      </div>

      <div class="lines">
        <div><span>Sous-total</span><span id="subtotal-val"></span></div>
        <div id="discount-row" class="hidden" style="color:var(--green)"><span id="discount-label"></span><span id="discount-val"></span></div>
        <div><span>Livraison</span><span id="shipping-val"></span></div>
        <p id="ship-hint" class="xs muted hidden" style="font-weight:700"></p>
        <div class="total-line"><span>Total</span><span id="total-val" style="color:var(--red-d)"></span></div>
      </div>

      <div>
        <label for="customer-pseudo" class="label">Ton pseudo Insta / TikTok</label>
        <input id="customer-pseudo" type="text" placeholder="@ton_pseudo" autocomplete="off" autocapitalize="off" class="input"/>
      </div>

      <div class="order-options">
        <button class="order-opt btn-paypal" onclick="orderPaypal()"><span class="ico" id="ico-pp"></span>Payer avec PayPal<small>montant pré-rempli</small></button>
        <button class="order-opt btn-pink" onclick="orderDM()"><span class="ico" id="ico-dm"></span>Commander en DM<small>Insta ou TikTok</small></button>
      </div>
      <a href="boutique.html" class="btn-ghost center" style="display:block;width:100%">← Continuer mes achats</a>
    </aside>
  </div>
</main>

<!-- Order modal -->
<div id="order-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="if(event.target===this)closeModal()">
  <div class="modal-card holo-border stack">
    <div class="row-between" style="flex-wrap:nowrap">
      <h2 id="modal-title" style="font-size:1.6rem"></h2>
      <button onclick="closeModal()" class="close-btn" aria-label="Fermer">×</button>
    </div>
    <div class="ref-box">
      <p class="xs" style="font-weight:800;text-transform:uppercase;letter-spacing:.06em">Ta référence de commande</p>
      <p id="modal-ref" class="ref"></p>
    </div>
    <ol class="steps" id="modal-steps"></ol>
    <a id="modal-paypal" target="_blank" rel="noopener" class="btn btn-paypal btn-block hidden">Payer sur PayPal →</a>
    <textarea id="modal-recap" readonly rows="9" class="input recap"></textarea>
    <button onclick="copyText(document.getElementById('modal-recap').value)" class="btn btn-yellow btn-block">Copier le récap</button>
    <div class="socials">
      <a id="modal-ig" target="_blank" rel="noopener" class="btn-ig">Instagram ↗</a>
      <a id="modal-tt" target="_blank" rel="noopener" class="btn-tt">TikTok ↗</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/art.js"></script>
<script src="js/layout.js"></script>
<script src="js/orders.js"></script>
<script>
let appliedPromo = null;

function renderCart() {
  const items = Cart.items;
  document.getElementById('empty-cart').classList.toggle('hidden', items.length > 0);
  document.getElementById('cart-content').classList.toggle('hidden', items.length === 0);
  if (!items.length) return;

  document.getElementById('cart-items').innerHTML = items.map(item => {
    const p = PRODUCTS.find(x => x.id === item.id) || {};
    const url = `produit.html?id=${encodeURIComponent(item.id)}`;
    return `
    <div class="citem">
      <a href="${url}" class="citem-media">${productVisual(p)}</a>
      <div class="citem-body">
        <div class="row-between" style="align-items:flex-start;flex-wrap:nowrap">
          <a href="${url}" class="citem-name">${escapeHtml(item.name)}</a>
          <span class="price" style="font-size:.8rem;white-space:nowrap">${fmt(item.price * item.qty)}</span>
        </div>
        ${item.variant ? `<span class="tag" style="margin-top:8px">${escapeHtml(item.variant)}</span>` : ''}
        <div class="row-between" style="margin-top:10px">
          <div class="qty"><button onclick="changeQty('${escapeHtml(item.key)}', ${item.qty - 1})" aria-label="Moins">−</button><span>${item.qty}</span><button onclick="changeQty('${escapeHtml(item.key)}', ${item.qty + 1})" aria-label="Plus">+</button></div>
          <button onclick="changeQty('${escapeHtml(item.key)}', 0)" class="btn-ghost">Retirer</button>
        </div>
      </div>
    </div>`;
  }).join('');

  updateTotals();
}

function changeQty(key, qty) {
  Cart.setQty(key, qty);
  renderCart();
}

function updateTotals() {
  const t = Cart.totals(appliedPromo);
  document.getElementById('subtotal-val').textContent = fmt(t.subtotal);
  document.getElementById('discount-row').classList.toggle('hidden', !t.promo);
  if (t.promo) {
    document.getElementById('discount-label').textContent = `Code ${appliedPromo}`;
    document.getElementById('discount-val').textContent = '-' + fmt(t.discount);
  }
  document.getElementById('shipping-val').textContent = t.shipping ? fmt(t.shipping) : 'Offerte';
  const hint = document.getElementById('ship-hint');
  const missing = SHOP_CONFIG.freeShippingFrom - (t.subtotal - t.discount);
  hint.classList.toggle('hidden', !t.shipping);
  if (t.shipping) hint.textContent = `Plus que ${fmt(missing)} pour la livraison offerte !`;
  document.getElementById('total-val').textContent = fmt(t.total);
}

function applyPromoCode() {
  const code = document.getElementById('promo-input').value.trim().toUpperCase();
  const result = Cart.applyPromo(code);
  const el = document.getElementById('promo-result');
  el.classList.remove('hidden');
  if (!result) {
    el.style.color = 'var(--red)';
    el.textContent = '✗ Code invalide';
    appliedPromo = null;
  } else {
    el.style.color = 'var(--green)';
    el.textContent = `✓ Code ${code} appliqué (${result.label})`;
    appliedPromo = code;
  }
  updateTotals();
}

function pseudoValue() {
  return document.getElementById('customer-pseudo').value.trim();
}

function placeOrder(method) {
  const pseudo = pseudoValue();
  if (!pseudo.replace('@', '')) {
    showToast('Indique ton pseudo Insta / TikTok !', true);
    document.getElementById('customer-pseudo').focus();
    return null;
  }
  const t = Cart.totals(appliedPromo);
  const order = Orders.create({
    customer: pseudo,
    method,
    items: Cart.items,
    subtotal: t.subtotal,
    promo: t.promo ? appliedPromo : null,
    discount: t.discount,
    shipping: t.shipping,
    total: t.total,
  });
  Cart.clear();
  appliedPromo = null;
  return order;
}

function orderPaypal() {
  if (!pseudoValue().replace('@', '')) { placeOrder('PayPal'); return; }
  // Ouvre l'onglet pendant le clic (évite le blocage des popups), puis crée la commande
  const win = window.open('', '_blank');
  const order = placeOrder('PayPal');
  const url = paypalLink(order.total);
  if (win) win.location.href = url; else window.open(url, '_blank');
  showOrderModal(order, url);
}

function orderDM() {
  const order = placeOrder('Commande en DM');
  if (order) showOrderModal(order);
}

function showOrderModal(order, paypalUrl) {
  const isPaypal = Boolean(paypalUrl);
  const ref = `<b style="color:var(--yellow)">${order.ref}</b>`;
  document.getElementById('modal-title').innerHTML = isPaypal ? 'Presque <span class="hl">fini</span> !' : 'Commande <span class="hl">prête</span> !';
  document.getElementById('modal-ref').textContent = order.ref;
  const steps = isPaypal
    ? `<li>Paie <b>${fmt(order.total)}</b> sur PayPal (bouton ci-dessous si l'onglet ne s'est pas ouvert) et ajoute ${ref} en note</li>
       <li>Copie ton récap ci-dessous</li>
       <li>Envoie-le-nous en DM pour valider ta commande</li>`
    : `<li>Copie ton récap ci-dessous</li>
       <li>Envoie-le en DM sur Instagram ou TikTok avec ta référence ${ref}</li>
       <li>On te répond vite pour le paiement et l'envoi</li>`;
  document.getElementById('modal-steps').innerHTML = steps.replace(/<li>(.*?)<\/li>/gs, '<li><span>$1</span></li>');
  const pp = document.getElementById('modal-paypal');
  pp.classList.toggle('hidden', !isPaypal);
  if (isPaypal) pp.href = paypalUrl;
  document.getElementById('modal-recap').value = Orders.recap(order);
  document.getElementById('modal-ig').href = `https://ig.me/m/${encodeURIComponent(SHOP_CONFIG.instagram)}`;
  document.getElementById('modal-tt').href = `https://www.tiktok.com/@${encodeURIComponent(SHOP_CONFIG.tiktok)}`;
  document.getElementById('order-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('order-modal').classList.add('hidden');
  renderCart();
}

document.getElementById('ico-pp').innerHTML = icon('card');
document.getElementById('ico-dm').innerHTML = icon('chat');
document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
