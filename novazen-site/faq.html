<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAQ – PokéShop</title>
  <meta name="theme-color" content="#110c1b"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="page container" style="max-width:820px">
  <div class="center" style="margin-bottom:30px">
    <span class="eyebrow">Réponses rapides</span>
    <h1 style="margin-top:12px">Questions <span class="hl">fréquentes</span></h1>
  </div>
  <div class="faq" id="faq"></div>
  <div class="panel center" style="margin-top:30px">
    <h3>Pas trouvé ta réponse ?</h3>
    <p class="muted" style="margin:6px 0 18px">Écris-nous en DM, on répond vite !</p>
    <a href="contact.html" class="btn btn-yellow">Nous contacter →</a>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/art.js"></script>
<script src="js/layout.js"></script>
<script>
const ship = fmt(SHOP_CONFIG.freeShippingFrom);
const faqs = [
  ['Comment passer commande ?', 'Ajoute tes articles au panier, indique ton pseudo Instagram ou TikTok, puis choisis « Payer avec PayPal » ou « Commander en DM ». Tu reçois une référence unique (ex : Z3F4-0001) et un récap à nous envoyer en DM.'],
  ['À quoi sert la référence de commande ?', 'Elle identifie ta commande. Mets-la en note de ton paiement PayPal et dans ton DM : on retrouve ta commande en une seconde.'],
  ['Quels moyens de paiement acceptez-vous ?', 'PayPal (le montant est pré-rempli automatiquement). Si tu commandes en DM, on te confirme le paiement directement dans la conversation.'],
  ['Les produits sont-ils officiels ?', 'Oui : cartes, boosters et coffrets sont scellés d\'origine, et les peluches/figurines sous licence sont indiquées sur leur fiche.'],
  ['Quels sont les délais de livraison ?', `Envoi sous 1 à 3 jours ouvrés après paiement, puis 2 à 4 jours en France métropolitaine. Livraison offerte dès ${ship}.`],
  ['Comment sont protégées les cartes ?', 'Les cartes voyagent sous sleeve + toploader rigide, dans une enveloppe renforcée ou un carton. Les peluches sont emballées dans du papier de soie.'],
  ['Comment utiliser un code promo ?', 'Dans le panier, saisis ton code puis « OK ». Le total, et donc le montant PayPal, est mis à jour automatiquement.'],
  ['Puis-je retourner un article ?', 'Oui, sous 14 jours pour un article neuf non ouvert (les boosters et produits scellés ouverts ne sont ni repris ni échangés). Voir la page Retours.'],
  ['Comment suivre ma commande ?', 'Envoie-nous ta référence en DM : on te donne le statut (en attente, payée, envoyée) et le numéro de suivi dès l\'expédition.'],
];
document.getElementById('faq').innerHTML = faqs.map(([q, a], i) => `<details ${i === 0 ? 'open' : ''}><summary>${q}</summary><p>${a}</p></details>`).join('');
</script>
</body>
</html>
