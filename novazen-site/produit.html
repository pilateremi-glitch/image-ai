<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produit – PokéShop</title>
  <meta name="theme-color" content="#110c1b"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="page container" id="product-page">
  <nav class="crumbs"><a href="index.html">Accueil</a> › <a href="boutique.html">Boutique</a> › <span id="crumb"></span></nav>

  <div class="grid-2" style="align-items:start">
    <div>
      <div class="gallery-main" id="main-vis"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="stack">
      <div class="row" style="flex-wrap:wrap;gap:8px" id="badges"></div>
      <div>
        <p class="pcard-cat" id="p-cat"></p>
        <h1 id="p-name" style="font-size:clamp(1.9rem,5vw,2.8rem);margin-top:4px"></h1>
      </div>
      <div class="row" style="align-items:baseline">
        <span class="price" id="p-price" style="font-size:1.6rem"></span>
        <span class="price-old" id="p-old" style="font-size:1.05rem"></span>
      </div>
      <p id="p-desc" style="color:#c9cfee;font-size:1.05rem"></p>

      <div id="variants-wrap" class="hidden">
        <p class="label">Choisis ton option :</p>
        <div class="row" style="flex-wrap:wrap;gap:8px" id="variants"></div>
      </div>

      <ul class="checklist" id="p-benefits"></ul>
      <div id="stock-warn" class="warn hidden"></div>

      <div class="row" style="flex-wrap:wrap">
        <div class="qty"><button onclick="setQty(qty-1)" aria-label="Moins">−</button><span id="qty">1</span><button onclick="setQty(qty+1)" aria-label="Plus">+</button></div>
        <button class="btn btn-yellow" style="flex:1;min-width:200px" onclick="addToCart()">Ajouter au panier</button>
      </div>
      <button class="btn btn-block" onclick="addToCart(true)">Commander maintenant →</button>

      <div class="perks" style="grid-template-columns:repeat(3,1fr)" id="p-perks"></div>
    </div>
  </div>

  <section class="section" style="padding-bottom:0">
    <div class="section-head"><div><span class="eyebrow">Suggestions</span><h2>Tu vas <span class="hl">aimer aussi</span></h2></div></div>
    <div class="products" id="related"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/art.js"></script>
<script src="js/layout.js"></script>
<script>
const p = PRODUCTS.find(x => x.id === getParam('id'));
let qty = 1;
let variant = null;

function setQty(n) {
  qty = Math.max(1, Math.min(n, p.stock || 99));
  document.getElementById('qty').textContent = qty;
}

function setVariant(v) {
  variant = v;
  document.querySelectorAll('.variant').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  document.getElementById('p-price').textContent = fmt((v && p.variantPrices?.[v]) || p.price);
}

function addToCart(go) {
  if (p.variants?.length && !variant) { showToast('Choisis une option d\'abord 😉', true); return; }
  Cart.add(p.id, qty, variant);
  if (go) location.href = 'panier.html';
}

if (!p) {
  document.getElementById('product-page').innerHTML = '<div class="empty"><span class="ball"></span><div class="dialog" style="max-width:420px;margin:12px auto 24px;text-align:left">Oh non ! Ce produit s\'est échappé…</div><p class="muted" style="margin:10px 0 20px">Produit introuvable.</p><a href="boutique.html" class="btn btn-red">Retour à la boutique</a></div>';
} else {
  document.title = `${p.name} – ${SHOP_CONFIG.name}`;
  document.getElementById('crumb').textContent = p.name;
  document.getElementById('p-cat').textContent = p.category;
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-price').textContent = fmt(p.price);
  if (p.comparePrice) document.getElementById('p-old').textContent = fmt(p.comparePrice);
  document.getElementById('p-desc').textContent = p.description;
  document.getElementById('badges').innerHTML = productBadges(p);
  document.getElementById('p-benefits').innerHTML = (p.benefits || []).map(b => `<li>${escapeHtml(b)}</li>`).join('');
  document.getElementById('p-perks').innerHTML = [['truck', `Offerte dès ${fmt(SHOP_CONFIG.freeShippingFrom)}`], ['shield', 'Envoi protégé'], ['chat', 'Réponse en DM']]
    .map(([ic, t]) => `<div class="perk" style="flex-direction:column;text-align:center;gap:8px;padding:14px 8px"><span class="perk-ico">${icon(ic)}</span><small style="font-weight:600;color:var(--text)">${t}</small></div>`).join('');

  const n = Math.max(1, p.images?.length || 0);
  const showVis = i => {
    document.getElementById('main-vis').innerHTML = productVisual(p, i);
    document.querySelectorAll('.thumb').forEach((t, j) => t.classList.toggle('active', i === j));
  };
  if (n > 1) {
    document.getElementById('thumbs').innerHTML = p.images.map((_, i) => `<button class="thumb">${productVisual(p, i)}</button>`).join('');
    document.querySelectorAll('.thumb').forEach((t, i) => t.onclick = () => showVis(i));
  }
  showVis(0);

  if (p.variants?.length) {
    document.getElementById('variants-wrap').classList.remove('hidden');
    document.getElementById('variants').innerHTML = p.variants.map(v =>
      `<button class="variant" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('');
    document.querySelectorAll('.variant').forEach(b => b.onclick = () => setVariant(b.dataset.v));
  }
  if (p.stock <= 5) {
    const w = document.getElementById('stock-warn');
    w.textContent = p.stock > 0 ? `Plus que ${p.stock} en stock !` : 'Rupture de stock – écris-nous en DM pour être prévenu·e';
    w.classList.remove('hidden');
  }
  const related = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category)
    .concat(PRODUCTS.filter(x => x.id !== p.id && x.category !== p.category)).slice(0, 4);
  document.getElementById('related').innerHTML = related.map(productCard).join('');
}
</script>
</body>
</html>
