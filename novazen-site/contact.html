<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – PokéShop</title>
  <meta name="theme-color" content="#080b16"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="page container">
  <div class="center" style="max-width:640px;margin:0 auto 34px">
    <span class="eyebrow">Contact</span>
    <h1 style="margin:12px 0 12px">Une <span class="hl">question</span> ?</h1>
    <p class="muted">Le plus rapide, c'est en DM ! On répond généralement dans la journée.</p>
  </div>

  <div class="grid-2">
    <div class="stack">
      <a id="c-ig" target="_blank" rel="noopener" class="panel row" style="gap:16px">
        <span class="perk-ico btn-ig" style="width:56px;height:56px;color:#fff" data-ico="insta"></span>
        <div style="flex:1"><h3>Instagram</h3><p class="muted small" id="c-ig-handle"></p></div>
        <span class="btn btn-yellow btn-sm">DM ▶</span>
      </a>
      <a id="c-tt" target="_blank" rel="noopener" class="panel row" style="gap:16px">
        <span class="perk-ico btn-tt" style="width:56px;height:56px;color:#fff" data-ico="tiktok"></span>
        <div style="flex:1"><h3>TikTok</h3><p class="muted small" id="c-tt-handle"></p></div>
        <span class="btn btn-sm">Voir ▶</span>
      </a>
      <div class="perks" style="grid-template-columns:1fr 1fr">
        <div class="perk"><span class="perk-ico" data-ico="chat"></span><div><b>Réponse rapide</b><small>Dans la journée</small></div></div>
        <div class="perk"><span class="perk-ico" data-ico="box"></span><div><b>Ta référence</b><small>Ex : Z3F4-0001</small></div></div>
      </div>
    </div>

    <div class="panel">
      <form id="contact-form" class="stack" onsubmit="sendByDM(event)">
        <h3>Prépare ton message</h3>
        <p class="small muted">On le met en forme, tu n'as plus qu'à le coller en DM.</p>
        <div><label class="label" for="f-pseudo">Ton pseudo *</label><input id="f-pseudo" required class="input" placeholder="@ton_pseudo"/></div>
        <div><label class="label" for="f-sujet">Sujet</label>
          <select id="f-sujet" class="input"><option>Ma commande</option><option>Question produit</option><option>Retour / échange</option><option>Autre</option></select></div>
        <div><label class="label" for="f-ref">Référence de commande (si tu en as une)</label><input id="f-ref" class="input" placeholder="Z3F4-0001"/></div>
        <div><label class="label" for="f-msg">Message *</label><textarea id="f-msg" required rows="4" class="input" placeholder="Coucou ! …"></textarea></div>
        <button class="btn btn-yellow btn-block">Copier & ouvrir Instagram ▶</button>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/art.js"></script>
<script src="js/layout.js"></script>
<script src="js/orders.js"></script>
<script>
document.querySelectorAll('[data-ico]').forEach(e => e.innerHTML = icon(e.dataset.ico));
const ig = SHOP_CONFIG.instagram, tt = SHOP_CONFIG.tiktok;
document.getElementById('c-ig').href = `https://ig.me/m/${encodeURIComponent(ig)}`;
document.getElementById('c-tt').href = `https://www.tiktok.com/@${encodeURIComponent(tt)}`;
document.getElementById('c-ig-handle').textContent = '@' + ig;
document.getElementById('c-tt-handle').textContent = '@' + tt;

async function sendByDM(e) {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const text = [`Coucou ! (${v('f-sujet')})`, v('f-ref') && `Réf : ${v('f-ref')}`, `De : ${v('f-pseudo')}`, '', v('f-msg')].filter(x => x !== '' && x !== undefined && x !== false).join('\n');
  const win = window.open('', '_blank');
  await copyText(text, '✓ Message copié, colle-le en DM !');
  const url = `https://ig.me/m/${encodeURIComponent(ig)}`;
  if (win) win.location.href = url; else window.open(url, '_blank');
}
</script>
</body>
</html>
