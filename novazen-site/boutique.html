<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique – PokéPop</title>
  <meta name="theme-color" content="#fff7ea"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="page container">
  <span class="tag tag-yellow">🛍️ La collection</span>
  <h1 style="margin:12px 0 6px">La <span class="hl hl-pink">boutique</span></h1>
  <p class="muted" id="count" style="font-weight:700"></p>

  <div class="row-between" style="margin:22px 0 12px;align-items:flex-start">
    <div class="chips" id="chips" style="flex:1;min-width:0"></div>
    <select id="sort" class="input" style="width:auto;padding:9px 14px" onchange="render()">
      <option value="">Trier : populaires</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
    </select>
  </div>

  <div class="products" id="grid"></div>
  <div id="none" class="empty hidden"><span class="ball"></span><h3>Aucun produit ici… pour l'instant !</h3></div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
let current = CATEGORIES.some(c => c.name === getParam('cat')) ? getParam('cat') : 'Tous';

function render() {
  const cats = [{ name: 'Tous', emoji: '⭐' }, ...CATEGORIES];
  document.getElementById('chips').innerHTML = cats.map(c =>
    `<button class="chip ${c.name === current ? 'active' : ''}" onclick="current='${c.name}';render()">${c.emoji} ${c.name}</button>`).join('');
  let list = current === 'Tous' ? [...PRODUCTS] : PRODUCTS.filter(p => p.category === current);
  const sort = document.getElementById('sort').value;
  if (sort) list.sort((a, b) => sort === 'asc' ? a.price - b.price : b.price - a.price);
  document.getElementById('grid').innerHTML = list.map(productCard).join('');
  document.getElementById('none').classList.toggle('hidden', list.length > 0);
  document.getElementById('count').textContent = `${list.length} produit${list.length > 1 ? 's' : ''} trop mignon${list.length > 1 ? 's' : ''}`;
}
render();
</script>
</body>
</html>
