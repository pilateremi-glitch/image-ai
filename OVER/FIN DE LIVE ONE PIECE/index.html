<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay Z3F4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --accent:#ffcb05; --accent2:#3b6fd8; --ink:#fff; }
  html,body { margin:0; height:100%; overflow:hidden; background:transparent; }
  body.preview { background:radial-gradient(circle at 50% 40%,#1d2a52,#090d1c 75%); }
  canvas { position:fixed; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  #hud { position:fixed; left:0; right:0; bottom:3vmin; display:flex; justify-content:center; pointer-events:none; }
  .bar { display:flex; align-items:center; gap:2.4vmin; padding:1.6vmin 2.8vmin;
         font-family:'Press Start 2P',ui-monospace,monospace; color:var(--ink);
         background:rgba(10,14,30,.82); border:.6vmin solid var(--accent);
         box-shadow:0 0 0 .6vmin #000, .8vmin .8vmin 0 .6vmin rgba(0,0,0,.55);
         image-rendering:pixelated; transition:border-color .6s; }
  #theme { font-size:2.2vmin; color:var(--accent); text-shadow:.3vmin .3vmin 0 #000; white-space:nowrap; transition:color .6s; }
  #clock { font-size:4vmin; letter-spacing:.3vmin; text-shadow:.4vmin .4vmin 0 #000; font-variant-numeric:tabular-nums; }
  #clock .sep { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:.15; } }
  #dbg { position:fixed; top:10px; left:10px; font:12px/1.5 ui-monospace,monospace; color:#cfe; background:rgba(0,0,0,.7);
         padding:8px 10px; border-radius:6px; display:none; white-space:pre; }
  body.preview #dbg { display:block; }
  body.nohud #hud, body.split #hud, body.end #hud { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="bar"><span id="theme">Z3F4</span><span id="clock">--<span class="sep">:</span>--</span></div></div>
<div id="dbg"></div>
<div id="err" style="display:none;position:fixed;left:0;right:0;top:35%;background:#b00020;color:#fff;font:bold 22px/1.4 monospace;padding:14px 18px;z-index:9"></div>
<script>
// Affiche toute erreur directement à l'écran (visible dans OBS) pour pouvoir la corriger
window.onerror = function (m, src, l) { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent = 'ERREUR OVERLAY Z3F4 : ' + m + ' (ligne ' + l + ')'; };
</script>
<script>window.OVERLAY_THEME = 'onepieceplus';window.OVERLAY_LAYOUT = 'end';</script>
<script>
(() => {
'use strict';
// ---------- Paramètres URL ----------
// ?twitch=NomDeChaine  ?theme=auto|pokemon|onepiece  ?hold=6  ?scale=0.9  ?hud=0  ?seconds=1  ?preview=1
const Q = new URLSearchParams(location.search);
const HOLD = Math.max(1, +Q.get('hold') || 6);
const SCALE = Math.min(1.5, Math.max(0.3, +Q.get('scale') || 0.9));
const SHOW_SEC = Q.get('seconds') === '1';
const LOGO_K = Math.min(1.5, Math.max(0.3, +Q.get('logo') || 0.8)); // taille du logo rond (?logo=0.8 par défaut)
const FORCED = (Q.get('theme') || window.OVERLAY_THEME || 'auto').toLowerCase();
const IN_OBS = !!window.obsstudio;
const TWITCH = (Q.get('twitch') || '').trim().replace(/^@/, '');
const POLL = Math.max(15, +Q.get('poll') || 30) * 1000;
if (Q.get('hud') === '0') document.body.classList.add('nohud');
// Mode séparateur : ?layout=split  (bande entre la caméra PORTRAIT et la caméra OPENING)
// S'adapte au format de la scène OBS : vertical (9:16) -> bande horizontale, horizontal (16:9) -> bande verticale.
const LAYOUT = (Q.get('layout') || window.OVERLAY_LAYOUT || 'center').toLowerCase();
const SPLIT = Math.min(0.8, Math.max(0.2, +Q.get('split') || window.OVERLAY_SPLIT || 0.35)); // bande à 35 % du haut
const FRAMES = Q.get('frames') === '1', LABELS = Q.get('labels') === '1'; // cadres et étiquettes désactivés par défaut
const LIVE = Q.get('live') !== '0'; // badge « ● LIVE » en haut à droite
const ZONE1 = (Q.get('zone1') || 'PORTRAIT').toUpperCase(), ZONE2 = (Q.get('zone2') || 'OPENING').toUpperCase();
if (LAYOUT === 'split') document.body.classList.add('split');
if (LAYOUT === 'end') document.body.classList.add('end');
if (Q.get('preview') === '1' || (!IN_OBS && Q.get('preview') !== '0')) document.body.classList.add('preview');

// ---------- Thème ----------
const THEMES = {
  pokemon:  { label:'SOIREE POKEMON',   accent:'#ffcb05', ink:'#fff', seq:['ball'] },
  onepiece: { label:'SOIREE ONE PIECE', accent:'#e63946', ink:'#ffe08a', seq:['hat'] },
  // Versions « collection » : une balle / un personnage différent à chaque passage
  pokemonplus:  { label:'SOIREE POKEMON',   accent:'#ffcb05', ink:'#fff', seq:['ball:poke','ball:great','ball:ultra','ball:master','ball:premier'] },
  onepieceplus: { label:'SOIREE ONE PIECE', accent:'#e63946', ink:'#ffe08a', seq:['hat:straw','hat:villain','hat:marine','hat:zoro','hat:doflamingo','hat:chopper','hat:sanji','hat:mihawk','hat:robin','hat:ace','hat:kuma','hat:brook','hat:law','hat:sabo'] },
  auto:     { label:'Z3F4 LE RAINTE DU TCG', accent:'#ffcb05', ink:'#fff', seq:['ball','hat'] },
};
let theme = 'auto', sceneName = '(hors OBS)';
function detect(name) {
  const n = (name || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if (/pokemon|poke|pkm|pocket/.test(n)) return 'pokemon';
  if (/one ?piece|\bop\b|\bop-?\d|luffy|pirate/.test(n)) return 'onepiece';
  return null;
}
function setTheme(t) {
  if (!THEMES[t]) t = 'auto';
  if (t === theme && document.getElementById('theme').textContent === THEMES[t].label) return;
  theme = t;
  const th = THEMES[t];
  document.documentElement.style.setProperty('--accent', th.accent);
  document.documentElement.style.setProperty('--ink', th.ink);
  document.getElementById('theme').textContent = th.label;
  seqIndex = -1; nextCycle(performance.now() / 1000);
}
function applyScene(name) {
  sceneName = name || '';
  if (FORCED !== 'auto') return;
  const d = detect(sceneName);
  if (d) setTheme(d);
}
// Le nom de la scène OBS pilote le thème. Une scène neutre (ex. « Pause ») garde le thème actuel.
// Thème piloté par la catégorie (puis le titre) du live Twitch, via decapi.me (pas de clé API).
let twitchGame = '-', twitchStatus = TWITCH ? 'en attente' : 'désactivé';
async function pollTwitch() {
  if (!TWITCH) return;
  try {
    const get = k => fetch(`https://decapi.me/twitch/${k}/${encodeURIComponent(TWITCH)}`, { cache: 'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)));
    const [game, title] = await Promise.all([get('game'), get('title').catch(() => '')]);
    twitchGame = game.trim().slice(0, 60);
    twitchStatus = 'OK ' + new Date().toLocaleTimeString('fr-FR');
    if (FORCED !== 'auto') return;
    const d = detect(game) || detect(title);
    if (d) setTheme(d);
  } catch (e) { twitchStatus = 'erreur (' + e.message + ') – nouvel essai'; }
}
function hookObs() {
  if (!IN_OBS || TWITCH) return;
  try { window.obsstudio.getCurrentScene && window.obsstudio.getCurrentScene(s => s && applyScene(s.name)); } catch (e) {}
  window.addEventListener('obsSceneChanged', e => applyScene(e.detail && e.detail.name));
}

// ---------- Horloge ----------
const clockEl = document.getElementById('clock');
function tickClock() {
  const d = new Date(), p = v => String(v).padStart(2,'0');
  clockEl.innerHTML = p(d.getHours()) + '<span class="sep">:</span>' + p(d.getMinutes()) + (SHOW_SEC ? ':' + p(d.getSeconds()) : '');
}
tickClock(); setInterval(tickClock, 1000);

// ---------- Canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.width = Math.round(innerWidth * DPR); H = cv.height = Math.round(innerHeight * DPR);
}
addEventListener('resize', resize); resize();

const logo = new Image(); let logoOk = false;
logo.onload = () => logoOk = true;
logo.onerror = () => { logoOk = false; const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = 'ERREUR OVERLAY Z3F4 : logo.png introuvable. Garde index.html et logo.png dans le même dossier.'; };
logo.src = 'logo.png';

// ---------- Rasteriseur pixel-art ----------
const N = 64, K = 1.2, low = document.createElement('canvas'); low.width = low.height = N;
const lc = low.getContext('2d'), idata = lc.createImageData(N, N);
const cells = new Array(N * N);
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function raster(fn, dissolve = 0) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let c = fn((x - N / 2 + 0.5) / K, (y - N / 2 + 0.5) / K, x, y);
    if (c && dissolve > 0 && hash(x, y) < dissolve) c = null;
    cells[y * N + x] = c;
  }
  const d = idata.data;
  for (let i = 0; i < N * N; i++) {
    let c = cells[i];
    if (!c) {
      const x = i % N, y = (i / N) | 0;
      const nb = (x > 0 && cells[i - 1]) || (x < N - 1 && cells[i + 1]) || (y > 0 && cells[i - N]) || (y < N - 1 && cells[i + N]);
      c = nb ? OUT : null;
    }
    const o = i * 4;
    if (c) { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; } else d[o + 3] = 0;
  }
  lc.putImageData(idata, 0, 0);
  return low;
}
let CAPTURE = null; // si défini, garde une copie du sprite (cache du défilé de fin)
function blit(src, cx, cy, cell, sx = 1, sy = 1) {
  if (CAPTURE) { const c = CAPTURE.getContext('2d'); c.clearRect(0, 0, N, N); c.drawImage(src, 0, 0); }
  ctx.imageSmoothingEnabled = false;
  const w = N * cell * sx, h = N * cell * sy;
  ctx.drawImage(src, Math.round(cx - w / 2), Math.round(cy - h / 2), Math.round(w), Math.round(h));
}
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const OUT = rgb('#111111');
const C = {
  red: rgb('#e3242b'), redD: rgb('#a3151b'), redL: rgb('#ff6b6b'), white: rgb('#f4f4f4'), grey: rgb('#c7c9d1'),
  black: rgb('#1b1b1b'), btn: rgb('#ffffff'), btnOn: rgb('#ff5252'),
  straw: rgb('#f2c14e'), strawL: rgb('#ffe08a'), strawD: rgb('#c8902e'), strawDD: rgb('#9a6a1e'),
  band: rgb('#d62828'), bandD: rgb('#8f1a1a'), in0: rgb('#2b1a0b'), in1: rgb('#5a3816'), in2: rgb('#7d5222'), glow: rgb('#fff3b0'),
};
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

// ---------- Sprites v2 : relief éclairé, tramage, détails ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.47);
const LX = -0.55, LY = -0.65, LZ = 0.53; // lumière en haut à gauche
const pal = a => a.map(rgb);
const P = {
  red: pal(['#6e0b10', '#a8141b', '#d9222a', '#f2474d', '#ff8a8c']),
  wht: pal(['#7f8696', '#b4bac7', '#dde1ea', '#f6f7fb', '#ffffff']),
  blk: pal(['#0e0e10', '#1d1d22', '#34343c', '#54545e']),
  btnOn: pal(['#b3141a', '#ff3b3b', '#ff8a8a', '#ffe0e0']),
  straw: pal(['#6b4512', '#9c6a20', '#cf9634', '#efbf55', '#ffe08f', '#fff3c4']),
  band: pal(['#5e0d0d', '#9a1818', '#cf2626', '#f0473c', '#ff8a70']),
  hole: pal(['#1a0f06', '#2e1c0c', '#4a2f14', '#6b4720']),
  glow: pal(['#ffd36b', '#ffe9a8', '#fffbe8', '#ffffff']),
};
const tone = (arr, lv, x, y) => arr[clamp(Math.round(lv + BAYER[(y & 3) * 4 + (x & 3)] * 0.9), 0, arr.length - 1)];
const sphereI = (nx, ny) => { const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)); return nx * LX + ny * LY + nz * LZ; };
const weave = (x, y) => (((x + 2 * y) % 5 + 5) % 5 === 0 ? -0.8 : 0) + (((2 * x - y) % 7 + 7) % 7 === 0 ? 0.6 : 0);

Object.assign(P, {
  blue: pal(['#0d2a6b', '#1748a8', '#2a6fe0', '#5a98ff', '#a8ccff']),
  purple: pal(['#2e0d4f', '#4f1a82', '#7430b8', '#9c58e0', '#cfa2ff']),
  pink: pal(['#7a1248', '#b8226a', '#ec4b97', '#ff8cc2', '#ffc6e0']),
  yellow: pal(['#7a5b00', '#b89200', '#f2c919', '#ffe45c', '#fff3b0']),
  dark: pal(['#08080b', '#15151b', '#25252e', '#3d3d49', '#62626f']),
  gold: pal(['#7a5410', '#b88a1e', '#e8b93a', '#ffdf7a']),
  navy: pal(['#071733', '#0e2a5c', '#1a428a', '#3567b8', '#7da3e6']),
  cap: pal(['#8d93a3', '#bfc5d1', '#e4e8f0', '#f7f8fb', '#ffffff']),
});
const bitmap = (rows, su, sv, cx, cy, cs) => {
  const c = Math.floor((su - cx) / cs + rows[0].length / 2), r = Math.floor((sv - cy) / cs + rows.length / 2);
  return r >= 0 && r < rows.length && c >= 0 && c < rows[0].length && rows[r][c] === '1';
};
const M_ROWS = ['10001', '11011', '10101', '10001', '10001'];
// Haut de la balle selon le modèle : poke, great (Super Ball), ultra (Hyper Ball), master, premier (Honor Ball)
function ballTop(su, sv, I, x, y) {
  const lv = 2 + I * 2.6;
  switch (variant) {
    case 'great':
      if ((Math.abs(su) - 6.8) ** 2 / 2.4 ** 2 + (sv + 6.8) ** 2 / 4.4 ** 2 <= 1) return tone(P.red, lv, x, y);
      return tone(P.blue, lv, x, y);
    case 'ultra':
      if (Math.abs(su) > 2.4 && Math.abs(su) < 5.4 && sv < -2.2) return tone(P.yellow, lv, x, y);
      return tone(P.dark, 1.6 + I * 2.4, x, y);
    case 'master':
      if (bitmap(M_ROWS, su, sv, 0, -7.6, 1.15)) return tone(P.wht, 3 + I, x, y);
      if (Math.hypot(Math.abs(su) - 7.4, sv + 6.4) < 2.5) return tone(P.pink, lv, x, y);
      return tone(P.purple, lv, x, y);
    case 'premier':
      return tone(P.wht, 2.1 + I * 2.4, x, y);
    default:
      return tone(P.red, lv, x, y);
  }
}
// Pokéball
const R = 13.6;
function ballShell(su, sv, u, v, x, y, part, btnLit) {
  const d = Math.hypot(su, sv);
  if (d > R) return null;
  if (part === 'top' && sv > 0.2) return null;
  if (part === 'bot' && sv < -0.2) return null;
  const I = sphereI(u / R, v / R);                  // éclairage fixe (écran) pendant que la balle tourne
  if (I > 0.9 && d > 2 && sv < -1.6) return P.wht[4]; // reflet spéculaire
  if (part !== 'top') {
    if (d < 1.4) return btnLit ? P.btnOn[3] : P.wht[4];
    if (d < 2.7) return btnLit ? tone(P.btnOn, 1.2 + I * 1.6, x, y) : tone(P.wht, 2 + I * 1.8, x, y);
    if (d < 3.4) return P.wht[1];
    if (d < 4.6) return tone(P.blk, 0.8 + I * 1.5, x, y);
  }
  if (Math.abs(sv) < 1.45) return variant === 'premier' ? tone(P.red, 1 + I * 2, x, y) : tone(P.blk, 0.7 + I * 1.8 + (sv < -0.8 ? 0.6 : 0), x, y);
  if (sv < 0) return ballTop(su, sv, I - (Math.abs(sv) < 2.4 ? 0.27 : 0), x, y);
  return tone(P.wht, 2.1 + I * 2.4 - (Math.abs(sv) < 2.4 ? 0.7 : 0), x, y);
}
function drawBall(cx, cy, cell, s, angle, lid, dissolve, btnLit) {
  // lid = angle d'ouverture : le couvercle bascule vers l'ARRIÈRE autour d'une charnière située au dos de la balle
  const th = Math.max(0, lid), c = Math.cos(th), sn = Math.sin(th), open = Math.min(1, th / 1.25);
  const src = raster((u, v, x, y) => {
    const [ru, rv] = rot(u, v, -angle);
    let col = ballShell(ru, rv, u, v, x, y, th > 0.001 ? 'bot' : 'all', btnLit);
    if (col) return col;
    if (th > 0.001) {
      const disc = R * R * c * c - ru * ru - rv * rv - 2 * R * rv * sn;
      if (disc >= 0) {
        const sq = Math.sqrt(disc);
        for (const [a, outer] of [[R * c + sq, true], [R * c - sq, false]]) {
          const yl = rv * c + a * sn, zl = -rv * sn + a * c - R; // point dans le repère du couvercle
          if (yl > 0.2) continue;
          if (outer) {
            const nx = ru / R, ny = (yl * c - zl * sn) / R;      // normale remise dans le repère écran (éclairage)
            return ballShell(ru, yl, nx * R, ny * R, x, y, 'top', btnLit);
          }
          if (yl > -1.6) return tone(P.blk, 1.5, x, y);                     // tranche du couvercle
          return tone(P.glow, 0.4 + (1 + yl / R) * 2.6 * open, x, y);     // intérieur illuminé
        }
      }
      // lumière qui jaillit de l'ouverture
      if (Math.hypot(ru, rv) < R && rv < 0.5) {
        const k = 1 - Math.hypot(ru * 0.8, rv + 1) / R;
        return tone(P.glow, 0.6 + k * 4 * open, x, y);
      }
      if (rv < 0 && rv > -R * 2.2 * open && Math.abs(ru) < R * (0.75 + 0.25 * -rv / R) && hash(x, y + Math.floor(performance.now() / 90)) < 0.18 * open)
        return P.glow[2 + (hash(y, x) < .5 ? 1 : 0)]; // étincelles du faisceau
    }
    return null;
  }, dissolve);
  if (btnLit && dissolve < 1) {
    const r = cell * s * 9, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(255,80,80,.45)'); g.addColorStop(1, 'rgba(255,80,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }
  blit(src, cx, cy, cell * s);
}

// Chapeau de paille
function frayed(e, x, y, lim = 1.16) { return e > 1 && e <= lim && hash(x * 7 + 3, y * 5 + 1) < 0.42; }
function hatSide(u, v, x, y, face) {
  const eTop = (u / 17) ** 2 + ((v - 6) / 3.6) ** 2;
  const eUnder = (u / 17) ** 2 + ((v - 7.3) / 3.6) ** 2;
  const crownE = (u / 9.6) ** 2 + ((v - 6) / 12.6) ** 2;
  const fu = u * face;
  // calotte (demi-ellipsoïde) devant la moitié arrière du bord
  if (v <= 6 && crownE <= 1) {
    const I = sphereI(fu / 9.6, (v - 6) / 12.6);
    if (v > 1.0 && v < 5.0) { // ruban rouge
      if (v < 1.9) return tone(P.band, 3 + I, x, y);
      if (v > 4.2) return tone(P.band, 0.6 + I, x, y);
      return tone(P.band, 1.8 + I * 1.8, x, y);
    }
    if (v >= 5.0) return tone(P.straw, 0.8 + I, x, y);       // ombre du bord sur la calotte
    return tone(P.straw, 2.3 + I * 2.4 + weave(x, y), x, y);
  }
  if (eTop <= 1 || (v > 6 && frayed(eTop, x, y))) {          // dessus du bord
    const lv = 2.6 - fu / 17 * 1.4 - (v - 6) / 3.6 * 0.5 + (v < 6 ? 0.4 : 0);
    return tone(P.straw, lv + weave(x, y) * 0.8, x, y);
  }
  if (eUnder <= 1 || (v > 7 && frayed(eUnder, x, y))) return tone(P.straw, 0.9 - fu / 17 * 0.6 + weave(x, y) * 0.5, x, y); // dessous
  if (v < 6 && frayed(eTop, x, y)) return tone(P.straw, 2.6, x, y);
  return null;
}
function hatInside(u, v, x, y, glow) {
  const e = (u / 18) ** 2 + (v / 10) ** 2;
  if (e > 1 && !frayed(e, x, y, 1.14)) return null;
  const ov = v + 0.5;
  const hole = (u / 9.6) ** 2 + (ov / 5.4) ** 2;
  if (hole <= 1) {
    if (glow > 0 && hole < glow * 0.95) return tone(P.glow, 3.2 - hole / Math.max(glow, .01) * 3, x, y);
    if (ov < -1.2) return tone(P.straw, 1.4 + weave(x, y) - (ov + 5.4) * -0.1, x, y); // paroi du fond éclairée
    return tone(P.hole, 2.6 - (ov + 1.2) / 6.6 * 2.6, x, y);
  }
  const bandE = (u / 11.3) ** 2 + (ov / 6.9) ** 2;
  if (bandE <= 1) return tone(P.band, ov < 0 ? 3 : 1.4 + (ov > 4 ? -0.8 : 0), x, y);
  // bord vu de dessus : tressage en spirale + lumière
  const r = Math.sqrt(e), a = Math.atan2(v / 10, u / 18) / (Math.PI * 2);
  const ring = Math.floor(r * 10 + a * 2) % 2;
  const lv = 2.5 - v / 10 * 1.1 - u / 18 * 0.6 + (ring ? 0.55 : -0.45) + (r > 0.94 ? -0.8 : 0);
  return tone(P.straw, lv, x, y);
}
// Intérieur générique (vue retournée) : ouverture sombre + doublure + lumière
function holeColor(u, v, x, y, glow, rx, ry, cyh, lining, pad) {
  const ov = v - cyh, hole = (u / rx) ** 2 + (ov / ry) ** 2;
  if (hole <= 1) {
    if (glow > 0 && hole < glow * 0.95) return tone(P.glow, 3.2 - hole / Math.max(glow, .01) * 3, x, y);
    return tone(P.hole, 2.6 - (ov + ry * 0.2) / (ry * 1.2) * 2.6, x, y);
  }
  if ((u / (rx + pad)) ** 2 + (ov / (ry + pad * 0.6)) ** 2 <= 1) return tone(lining, ov < 0 ? 3 : 1.4, x, y);
  return null;
}

const ANCHOR = ['00100', '01110', '00100', '10101', '01110'];
function marineSide(u, v, x, y, face) {
  const fu = u * face;
  const top = Math.abs(u) <= 9 ? -2.5 - 3.2 * Math.sqrt(Math.max(0, 1 - (u / 9) ** 2)) : 99;
  if (fu > 5 && fu < 16 && v >= 4.6 && v <= 4.6 + 2.2 * (1 - (fu - 5) / 13) + 0.6) // visière
    return tone(P.navy, v < 5.4 ? 3 : 1.2, x, y);
  if (Math.abs(u) <= 9 && v >= top && v <= 6) {
    const I = sphereI(fu / 9.5, (v - 1) / 9);
    if (v >= 2.2 && v <= 5.4) return tone(P.navy, 1.6 + I * 1.8, x, y);
    if (v > 5.4) return tone(P.cap, 0.6 + I, x, y);
    if (bitmap(ANCHOR, fu, v, -1, -1.6, 0.95)) return tone(P.gold, 2 + I * 1.4, x, y);
    return tone(P.cap, 2.1 + I * 2.2, x, y);
  }

}

  if (h) return h;
  if ((u / 11) ** 2 + ((v + 1.2) / 7) ** 2 <= 1) return tone(P.cap, 2.4 - v / 7 + (v < -4 ? 0.8 : 0), x, y);

}

function villainSide(u, v, x, y, face) {

  if (bot - v < 1.2) return tone(P.gold, 1.2 + I * 1.6, x, y);

  const d = Math.min(edge(A, B), edge(B, C), edge(C, A));
  if (d < 0) return null;
  const h = holeColor(u, v, x, y, glow, 7.8, 4.8, -1.4, P.red, 1.8);
  if (h) return h;

function segD(u, v, ax, ay, bx, by) { // distance au segment + position t (0..1)
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;

// Fleur de mains (Robin)
function robinFlower(u, v, x, y, face, back) {

  if (r < 3.6) return tone(P.petal, 1.2, x, y);

const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eoBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eoBounce = x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };

// ---------- Séquenceur ----------
const T_REVEAL = 4.2, T_EXIT = 0.9, T_GAP = 0.35;
const cycleLen = () => T_REVEAL + HOLD + T_EXIT + T_GAP;
let seqIndex = -1, kind = 'ball', variant = '', t0 = 0, fired = {};
function nextCycle(now) {
  const seq = THEMES[theme].seq; seqIndex = (seqIndex + 1) % seq.length;
  [kind, variant = ''] = seq[seqIndex].split(':'); t0 = now; fired = {};
}
const once = k => fired[k] ? false : (fired[k] = true);

let last = performance.now() / 1000, fps = 0;
function frame(nowMs) {
  const now = nowMs / 1000, dt = Math.min(0.05, now - last); last = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
  let t = now - t0;
  if (t > cycleLen()) { nextCycle(now); t = 0; }
  ctx.clearRect(0, 0, W, H);
  if (LAYOUT === 'end') { drawEnd(now); requestAnimationFrame(frame); return; }

  let S, cx, cy, geo = null;
  if (LAYOUT === 'split') {
    // bande TOUJOURS horizontale (caméras haut / bas), même si la source n'a pas la bonne taille ; ?band=vertical pour gauche / droite
    const vert = Q.get('band') !== 'vertical';
    const T = Math.round(vert ? Math.max(H * 0.1, Math.min(W, H) * 0.14) : W * 0.085);
    cx = vert ? W / 2 : W * SPLIT; cy = vert ? H * SPLIT : H / 2;
    S = (vert ? Math.min(W * 0.6, H * 0.3) : Math.min(H * 0.6, W * 0.3)) * SCALE;
    geo = { vert, T };
  } else {
    const hudH = document.body.classList.contains('nohud') ? 0 : H * 0.16;
    S = Math.min(W, H - hudH) * SCALE; cx = W / 2; cy = (H - hudH) / 2;
  }
  const cell = Math.max(2, Math.round(S / 76.8));
  const logoW = S * 0.98 * LOGO_K;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffcb05';

  if (geo) drawSplit(geo, cx, cy, cell, accent, now);
  const tHold = T_REVEAL + HOLD;
  // Phase logo commune
  let logoA = 0, logoS = 0, logoPix = 1, logoY = cy;
  if (t >= 3.3 && t < tHold) {
    const k = seg(t, 3.3, T_REVEAL);
    logoA = clamp(k * 3); logoS = 0.08 + 0.92 * eoBack(k); logoPix = 1 + 46 * Math.pow(1 - k, 2);
    if (kind === 'hat') logoY = cy + (1 - eio(k)) * cell * 4;
    if (t >= T_REVEAL) logoY = cy + Math.sin((t - T_REVEAL) * 2) * cell * 0.8;
  } else if (t >= tHold && t < tHold + T_EXIT) {
    const k = seg(t, tHold, tHold + T_EXIT);
    logoA = 1 - eio(k); logoS = 1 - 0.85 * eio(k); logoPix = 1 + 46 * k * k;
    if (once('exit')) burst(cx, cy, 40, cell, ['#ffffff', accent, '#ffd23f'], 1.3);
  }
  // halo derrière le logo
  if (logoA > 0) rays(cx, logoY, logoW * 0.62 * logoS, now, 0.22 * logoA, accent);

  if (kind === 'ball') {
    let s = 1, ang = 0, y = cy, lid = 0, dis = 0, lit = false;
    if (t < 0.5) { s = eoBack(seg(t, 0, 0.5)); ang = -2 * (1 - seg(t, 0, .5)); }
    else if (t < 2.3) { const k = seg(t, 0.5, 2.3); ang = eio(k) * Math.PI * 6; y = cy - Math.abs(Math.sin(k * Math.PI * 3)) * cell * 5; }
    else if (t < 2.9) { const k = seg(t, 2.3, 2.9); ang = Math.sin(k * Math.PI * 6) * 0.35 * (1 - k * 0.5); lit = (k * 6 | 0) % 2 === 0; }
    else if (t < 3.3) { const k = seg(t, 2.9, 3.3); lid = 1.25 * eoBack(k); lit = true;
      if (once('open')) burst(cx, cy, 70, cell, ['#ffffff', '#ff5252', '#ffcb05', '#3b6fd8']); }
    else if (t < T_REVEAL) { const k = seg(t, 3.3, T_REVEAL); lid = 1.25; dis = k; s = 1 - 0.4 * k; y = cy + k * cell * 6; }
    else dis = 1;
    if (t >= 2.9 && t < 3.6) { // flash
      const k = seg(t, 2.9, 3.6); const r = S * 0.7 * eio(k);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r));
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.5, 'rgba(255,240,180,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1 - k; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
    if (dis < 1 && t < tHold) drawBall(cx, y, cell, s, ang, lid, dis, lit);
  } else {
    let s = 1, yaw = 0, flip = 0, y = cy, dis = 0, glow = 0;
    if (t < 0.5) { y = cy - (1 - eoBounce(seg(t, 0, 0.5))) * H * 0.6; }
    else if (t < 2.3) { const k = seg(t, 0.5, 2.3); yaw = eio(k) * Math.PI * 6; y = cy - Math.sin(k * Math.PI) * cell * 4; }
    else if (t < 3.0) { const k = seg(t, 2.3, 3.0); flip = eio(k); y = cy - Math.sin(k * Math.PI) * cell * 10;
      if (k > .55 && once('land')) burst(cx, cy, 24, cell, ['#f2c14e', '#ffe08a', '#d62828'], .7); }
    else if (t < 3.3) { flip = 1; glow = seg(t, 3.0, 3.3); if (once('glow')) burst(cx, cy, 50, cell, ['#fff3b0', '#ffffff', '#ffd23f'], .9); }
    else if (t < T_REVEAL) { const k = seg(t, 3.3, T_REVEAL); flip = 1; glow = 1; dis = k; s = 1 - 0.3 * k; y = cy + k * cell * 8; }
    else dis = 1;
    if (glow > 0 && t < T_REVEAL) rays(cx, y, S * 0.35 * glow, now, 0.35 * glow * (1 - dis), '#fff3b0');
    if (dis < 1 && t < tHold) drawHat(cx, y, cell, s, yaw, flip, dis, glow);
  }

  drawLogo(cx, logoY, logoW * logoS, logoPix, logoA);
  if (t >= T_REVEAL && t < tHold) {
    for (let i = 0; i < 10; i++) {
      const ph = now * 1.3 + i * 1.7, a = Math.max(0, Math.sin(ph * 2.1));
      const ang = i * 2.39996 + Math.floor(ph / Math.PI) * 0.9, r = logoW * (0.42 + 0.08 * Math.sin(i * 7.1));
      sparkle(cx + Math.cos(ang) * r, logoY + Math.sin(ang) * r * 0.9, cell * 0.8, a, i % 2 ? '#ffffff' : accent);
    }
  }
  stepParts(dt, cell);
  if (geo) drawSplitText(geo, cx, cy, S, cell, accent);
  if (LIVE && !geo) drawLive(now);

  if (document.body.classList.contains('preview')) {
    dbg.textContent = `OBS détecté : ${IN_OBS ? 'oui' : 'non (aperçu)'}\nTwitch : ${TWITCH || '—'} · ${twitchStatus}\nCatégorie : ${twitchGame}\nScène : ${sceneName}\nThème : ${theme}${FORCED !== 'auto' ? ' (forcé)' : ''}\nLogo : ${logoOk ? 'OK' : 'ERREUR logo.png'}\nAnim : ${kind}${variant ? ':' + variant : ''}  t=${t.toFixed(1)}s\nFPS : ${fps.toFixed(0)}`;
  }
  requestAnimationFrame(frame);
}
const dbg = document.getElementById('dbg');
window.__overlay = { setTheme, detect, pollTwitch, get state() { return { theme, kind, variant, name: itemName(), logoOk, fps, sceneName }; } };
setTheme(FORCED !== 'auto' ? FORCED : 'auto');
hookObs();
pollTwitch(); if (TWITCH) setInterval(pollTwitch, POLL);
requestAnimationFrame(frame);
})();
</script>
</body>
