<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Z3 LIVE — Scènes (bientôt · pause · fin)</title>
<link rel="stylesheet" href="src/overlay.css">
<style>
  .stage { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .card { position: relative; width: 1180px; padding: 46px 60px 40px; text-align: center;
    background: linear-gradient(135deg, rgba(14,3,28,.84), rgba(48,8,80,.72));
    clip-path: polygon(40px 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%, 0 40px); }
  .card::before { content: ''; position: absolute; inset: 0; border: 2px solid rgba(255,63,208,.8);
    clip-path: inherit; pointer-events: none; }
  .top { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .top .z3 { font-family: Bangers; font-size: 120px; line-height: .9; transform: skewX(-8deg);
    background: linear-gradient(180deg, #fff, #ffd2f6 30%, #ff3fd0 62%, #9a2cff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,63,208,.9)) drop-shadow(0 5px 0 #4a0f86); }
  .top .names { text-align: left; }
  .top .names div:first-child { font-size: 46px; letter-spacing: 7px; text-shadow: var(--glow-v); }
  .top .names div:first-child b { color: var(--pink); }
  .top .names div:last-child { font-size: 26px; letter-spacing: 5px; color: #e9c7ff; }
  .top .names div:last-child span { color: #fff; background: linear-gradient(90deg, #ff3fd0, #8b2cff); padding: 2px 12px; margin-left: 6px; }
  .title { margin-top: 26px; font-family: Bangers; font-size: 104px; letter-spacing: 4px; line-height: 1; color: #fff;
    -webkit-text-stroke: 2px #ff3fd0; text-shadow: 0 0 26px rgba(255,63,208,.9), 0 6px 0 #3a0a66; }
  .jp { display: block; margin-top: 6px; font-size: 30px; letter-spacing: 16px; color: var(--pink); }
  .count { margin-top: 18px; font-family: Orbitron; font-weight: 900; font-size: 110px; letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 2px #fff, 0 0 18px #ff3fd0, 0 0 44px rgba(255,63,208,.8), 0 5px 0 #5a0f86; font-variant-numeric: tabular-nums; }
  .sub { margin-top: 8px; font-size: 26px; letter-spacing: 8px; color: #f0d4ff; }
  .food { position: relative; height: 150px; margin-top: 18px; }
  .food .sw { position: absolute; left: 0; bottom: 6px; width: 860px; height: 60px; }
  .food .dk { position: absolute; right: 20px; bottom: 0; width: 136px; height: 150px; }
  .food svg { width: 100%; height: 100%; overflow: visible; }
  .recap { margin-top: 18px; filter: hue-rotate(calc(-1 * var(--hue, 0deg))); }   /* couleurs des raretés fixes quel que soit le thème */
  .recap .chips { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .recap .chip { min-width: 112px; padding: 6px 12px 4px; background: rgba(255,255,255,.06); border: 1.5px solid var(--c, #b44dff); }
  .recap .chip b { display: block; font-family: Orbitron; font-weight: 900; font-size: 34px; line-height: 1.1; color: var(--c, #fff); text-shadow: 0 0 12px var(--c, #ff3fd0); }
  .recap .chip span { font-size: 13px; letter-spacing: 3px; color: #f0d4ff; }
  .recap .gal { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .recap .cardx { position: relative; width: 118px; height: 165px; border-radius: 8px; overflow: hidden; border: 3px solid var(--c); box-shadow: 0 0 16px var(--c);
    background: linear-gradient(160deg, #2a0748, #12031f); display: grid; place-items: center; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .recap .cardx img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .recap .cardx i { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px; font-style: normal; font-size: 11px; line-height: 1.1; background: rgba(10,2,20,.88); color: #fff; }
  .recap .cardx em { font-style: normal; font-family: Bangers; font-size: 30px; color: var(--c); }
  @keyframes pop { from { transform: scale(.2) rotate(-10deg); opacity: 0; } }
  .recap .none { color: #e9c7ff; letter-spacing: 4px; margin-top: 10px; }
  .rule { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; font-size: 22px; letter-spacing: 4px; padding: 6px 18px;
    background: linear-gradient(90deg, rgba(255,63,208,.95), rgba(139,44,255,.9), rgba(255,63,208,.95), rgba(255,210,58,.9), rgba(255,63,208,.95)); clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .ticker { position: absolute; left: 0; right: 0; bottom: 24px; height: 52px; overflow: hidden; display: flex; align-items: center;
    background: linear-gradient(90deg, rgba(14,3,28,.0), rgba(14,3,28,.85) 10%, rgba(14,3,28,.85) 90%, rgba(14,3,28,0));
    border-top: 2px solid rgba(255,63,208,.7); border-bottom: 2px solid rgba(180,77,255,.7); }
  .ticker .run { white-space: nowrap; font-size: 26px; letter-spacing: 6px; animation: tick 40s linear infinite; }
  .ticker .run b { color: var(--pink); margin: 0 26px; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ===================== animations (scène en boucle) ===================== */
  #emb { position: relative; display: grid; place-items: center; }
  #emb::before { content: ''; position: absolute; width: 330px; height: 330px; border-radius: 50%; z-index: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255,210,58,.55) 0 4deg, transparent 4deg 16deg);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%); mask: radial-gradient(circle, #000 25%, transparent 68%); animation: raysspin 9s linear infinite; }
  @keyframes raysspin { to { transform: rotate(360deg); } }
  #emb img { position: relative; z-index: 1; animation: logoin 1.1s cubic-bezier(.2,1.5,.4,1) both, logopulse 3s ease-in-out 1.1s infinite !important; }
  @keyframes logoin { from { transform: scale(.1) rotate(-200deg); opacity: 0; } }
  #emb .shine { position: absolute; inset: 0; z-index: 2; pointer-events: none; -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.85) 48%, transparent 60%) 0 0 / 300% 100%; animation: logoshine 3.2s ease-in-out 1.4s infinite; }
  @keyframes logoshine { 0% { background-position: 150% 0; } 45%, 100% { background-position: -150% 0; } }
  .spark { position: absolute; width: 10px; height: 10px; pointer-events: none; animation: twinkle 1.6s ease-in-out infinite; }
  .spark::before, .spark::after { content: ''; position: absolute; left: 4px; top: 0; width: 2px; height: 10px; background: #fff; box-shadow: 0 0 8px #ffd23a; border-radius: 2px; }
  .spark::after { transform: rotate(90deg); }
  @keyframes twinkle { 0%, 100% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.6) rotate(45deg); opacity: 1; } }
  .title .ch { display: inline-block; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%, 60%, 100% { transform: translateY(0) scale(1); } 20% { transform: translateY(-22px) scale(1.12); color: #ffe46b; } 40% { transform: translateY(4px) scale(.98); } }
  .recap .chip { animation: chipin .6s cubic-bezier(.2,1.5,.4,1) both, chipglow 7s ease-in-out infinite; }
  @keyframes chipin { from { transform: translateY(30px) scale(.6); opacity: 0; } }
  @keyframes chipglow { 0%, 12%, 100% { box-shadow: none; transform: none; } 6% { box-shadow: 0 0 26px var(--c), inset 0 0 18px var(--c); transform: translateY(-6px) scale(1.06); } }
  .recap .cardx { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both, float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
  .recap .cardx::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.7) 45%, rgba(123,255,234,.45) 52%, rgba(255,63,208,.35) 58%, transparent 70%) 0 0 / 300% 100%;
    animation: holo 4s ease-in-out infinite; animation-delay: inherit; }
  @keyframes holo { 0% { background-position: 160% 0; } 40%, 100% { background-position: -160% 0; } }
  .recap .cardx.star { z-index: 3; animation: pop .6s both, starcard 1.8s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes starcard { 0% { transform: none; } 25%, 75% { transform: translateY(-8px) scale(1.16); box-shadow: 0 0 40px var(--c), 0 0 80px var(--c); } 100% { transform: none; } }
  .rule { background-size: 220% 100% !important; animation: rulemove 4s linear infinite; }
  @keyframes rulemove { to { background-position: -220% 0; } }
  .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; clip-path: inherit;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%) 0 0 / 300% 100%; animation: holo 6s linear infinite; }
  @keyframes logopulse { 50% { transform: scale(1.04) rotate(-1.5deg); } }
  .badge { position: absolute; right: 30px; top: 20px; flex-direction: column; text-align: center; gap: 4px; display: flex; align-items: center; gap: 14px; font-size: 18px; letter-spacing: 5px; color: #e9c7ff; }
  .badge .t2 { margin-top: 6px; font-family: Bangers; font-size: 40px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 12px #ff3fd0; line-height: .95; }
</style>
</head>
<body>
<div class="layer" id="ui">
  <div class="badge"><span id="emb"></span><div>PARTENAIRE OFFICIEL<div class="t2">LE RAINTÉ DU TCG</div></div></div>
  <div class="stage"><div class="card">
    <div class="top"><div class="z3">Z3</div><div class="names"><div>TEAM <b>Z3F4</b></div><div>BY<span>LE RAINTÉ DU TCG</span></div></div></div>
    <div class="title" id="title"></div>
    <span class="jp" id="jp"></span>
    <div class="count" id="count">00:00</div>
    <div class="sub" id="sub"></div>
    <div class="food"><div class="sw" id="sw"></div><div class="dk" id="dk"></div></div>
    <div class="recap" id="recap" hidden></div>
    <div class="rule" id="rule"></div>
  </div></div>
  <div class="ticker"><div class="run" id="run"></div></div>
</div>
<script src="src/art.js"></script>
<script>
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const mode = Q.get('mode') || 'soon';
  // les fonds MIX + décors interactifs sont activés par défaut
  if (!Q.has('scene')) { const u = new URL(location.href); u.searchParams.set('scene', Q.get('bg') || 'mix'); history.replaceState(null, '', u); }
  const A = window.Z3Art, $ = (s) => document.getElementById(s);
  // logo officiel du partenaire : preview/logo-rainte.png (sinon l'emblème dessiné)
  $('emb').innerHTML = A.emblemSVG(86, 'emS');
  { const lg = new Image(); lg.onload = () => { $('emb').innerHTML = ''; $('emb').style.setProperty('--logo', `url('${lg.src}')`); lg.style.cssText = 'height:190px;width:auto;max-width:260px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(255,63,208,.75)) drop-shadow(0 6px 10px rgba(0,0,0,.6));animation:logopulse 3s ease-in-out infinite'; $('emb').appendChild(lg); $('emb').insertAdjacentHTML('beforeend', '<div class="shine"></div>' + [[-20, 10], [210, 30], [-10, 150], [220, 160], [100, -12], [40, 190]].map(([x, y], i) => `<i class="spark" style="left:${x}px;top:${y}px;animation-delay:${i * 0.27}s"></i>`).join('')); }; lg.src = 'preview/logo-rainte.png'; }
  const DEVIL = '<svg width="26" height="26" viewBox="0 0 32 32"><path d="M5 4l5 7M27 4l-5 7" stroke="#ff2f8a" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="18" r="12" fill="#b44dff"/><circle cx="12" cy="17.6" r="1.8" fill="#fff"/><circle cx="20" cy="17.6" r="1.8" fill="#fff"/><path d="M9.5 21.5q6.5 6 13 0" fill="#fff"/></svg>';

  // niveau du sandwich : repris du chrono de l'overlay (même ordinateur), sinon selon la scène
  let level = mode === 'soon' ? 0 : mode === 'end' ? 14 : 7;
  try { const st = JSON.parse(localStorage.getItem('z3f4-timer-v1') || 'null');
    if (st && mode === 'pause') { const rem = st.paused ? st.left : (st.endAt - Date.now()) / 1000; level = rem <= 0 ? 14 : Math.min(13, Math.floor((1 - rem / st.total) * 14)); } } catch (e) { /* rien */ }
  if (Q.has('level')) level = +Q.get('level');
  $('sw').innerHTML = A.sandwichSVG(level, 'scsw').replace('viewBox="0 0 1600 112"', 'viewBox="0 0 1600 112" preserveAspectRatio="xMinYMax meet"');
  $('dk').innerHTML = A.drinkSVG(level, 'scdk');

  const M = {
    soon:  { t: 'LE LIVE COMMENCE BIENTÔT', jp: 'まもなく配信開始', sub: 'INSTALLE-TOI · SORS LES BOOSTERS · ÇA VA OUVRIR FORT', rule: `LE SANDWICH EST PRÊT… LE LIVE DURE TANT QU'IL EN RESTE ${DEVIL}` },
    pause: { t: 'PETITE PAUSE', jp: '休憩中', sub: 'ON REVIENT TRÈS VITE · NE BOUGE PAS', rule: `LE SANDWICH ATTEND… IL EN RESTE ENCORE ${DEVIL}` },
    end:   { t: 'MERCI POUR LE LIVE !', jp: 'ありがとう', sub: 'IL NE RESTE PLUS RIEN · À TRÈS VITE SUR Z3 LIVE', rule: `SANDWICH TERMINÉ · VERRE VIDE · GG ${DEVIL}` },
  }[mode] || {};
  $('title').innerHTML = [...(M.t || '')].map((c, i) => c === ' ' ? ' ' : `<span class="ch" style="animation-delay:${(i * 0.06).toFixed(2)}s">${c}</span>`).join(''); $('jp').textContent = M.jp; $('sub').textContent = M.sub; $('rule').innerHTML = M.rule;
  const items = ['OUVERTURES DE DISPLAYS', 'POKÉMON', 'ONE PIECE CARD GAME', 'TEAM Z3F4', 'LE RAINTÉ DU TCG', 'LE LIVE SE TERMINE QUAND IL NE RESTE PLUS RIEN', 'FOLLOW POUR NE RIEN RATER'];
  const line = items.map((t) => `${t}<b>✦</b>`).join('');
  $('run').innerHTML = line + line;

  // compte à rebours : ?in=10m · ?at=20:30 · fin : pas de compteur
  const dur = (s) => { let t = 0, m; const re = /(\d+(?:\.\d+)?)\s*(h|m|s)/g; while ((m = re.exec(s))) t += parseFloat(m[1]) * (m[2] === 'h' ? 3600 : m[2] === 'm' ? 60 : 1); return t || parseFloat(s) || 0; };
  let target = null;
  if (Q.get('at')) { const [h, mi] = Q.get('at').split(':').map(Number); const d = new Date(); d.setHours(h, mi || 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); target = +d; }
  else if (mode !== 'end') target = Date.now() + dur(Q.get('in') || (mode === 'pause' ? '5m' : '10m')) * 1000;
  const fmt = (s) => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
  if (!target) $('count').style.display = 'none';

  /* récap du live (rempli par l'overlay pendant le live) */
  if (mode === 'end') {
    let r = null; try { r = JSON.parse(localStorage.getItem('z3-recap-v1') || 'null'); } catch (e) { r = null; }
    if (Q.has('demo')) r = { cards: 214, newCards: 37, flops: 3, boosters: 41, items: { ETB: 2, UPC: 1, Tripack: 3, Booster: 5 }, hits: [
      { tier: 'god', name: 'GOD PACK' }, { tier: 'secret', name: 'Pikachu-ex 238/191' }, { tier: 'secret', name: 'Luffy OP05-119' },
      { tier: 'ultra', name: 'Balbalèze 201/191' }, { tier: 'ultra', name: 'Shanks OP09-004' }, { tier: 'rare', name: 'Évoli' }, { tier: 'ultra', name: 'Dracaufeu-ex' }] };
    if (r) {
      const C = { rare: '#7bd0ff', ultra: '#ffd23a', secret: '#ff3fd0', god: '#ffd23a' }, L = { rare: 'RARE', ultra: 'HIT', secret: 'SECRÈTE', god: 'GOD' };
      const cnt = (t) => r.hits.filter((h) => h.tier === t).length;
      const esc = (x) => String(x || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const chips = [['BOOSTERS', r.boosters || 0, '#ff3fd0'], ['CARTES', r.cards, '#b44dff'], ['NOUVELLES', r.newCards, '#3dff9a'], ['RARE', cnt('rare'), C.rare], ['HIT', cnt('ultra'), C.ultra], ['SECRÈTE', cnt('secret'), C.secret], ['GOD PACK', cnt('god'), C.god]]
        .map(([l, v, c]) => `<div class="chip" style="--c:${c}"><b>${v}</b><span>${l}</span></div>`).join('');
      const rank = { god: 4, secret: 3, ultra: 2, rare: 1 };
      const top = r.hits.slice().sort((a, b) => (rank[b.tier] - rank[a.tier]) || (b.t || 0) - (a.t || 0)).filter((h) => h.tier !== 'god' || h.img || h.snap).slice(0, 7);
      const gal = top.map((h, i) => `<div class="cardx" style="--c:${C[h.tier]};animation-delay:${0.3 + i * 0.15}s"><em>${L[h.tier]}</em>${h.img || h.snap ? `<img src="${esc(h.img || h.snap)}" data-alt="${esc(h.img ? h.snap : '')}">` : ''}<i>${esc(h.name)}</i></div>`).join('');
      $('recap').innerHTML = `<div class="chips">${chips}</div>${gal ? `<div class="gal">${gal}</div>` : '<div class="none">PAS DE HIT CE SOIR… LE PROCHAIN SERA LE BON</div>'}`;
      $('recap').querySelectorAll('img').forEach((im) => { im.onerror = () => { if (im.dataset.alt) { im.src = im.dataset.alt; im.dataset.alt = ''; } else im.remove(); }; });
      $('recap').hidden = false;
      $('recap').querySelectorAll('.chip').forEach((c, i) => { c.style.animationDelay = `${0.1 + i * 0.1}s, ${1 + i * 1}s`; });
      const cards = [...$('recap').querySelectorAll('.cardx')];
      cards.forEach((c, i) => { c.style.animationDelay = `${0.3 + i * 0.15}s, ${i * 0.4}s`; });
      let star = 0;                                   // une carte à la fois passe au premier plan
      if (cards.length) setInterval(() => { cards.forEach((c) => c.classList.remove('star')); const c = cards[star++ % cards.length]; void c.offsetWidth; c.classList.add('star'); }, 2000);
      // compteurs qui défilent
      $('recap').querySelectorAll('.chip b').forEach((b) => { const v = +b.textContent || 0, t0 = performance.now() + 300;
        (function tick(now) { const k = Math.max(0, Math.min(1, (now - t0) / 1400)); b.textContent = Math.round(v * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); })(performance.now()); });
      document.querySelector('.food').style.display = 'none';
      const it = Object.entries(r.items || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      if (it.length || r.boosters) $('rule').textContent = 'OUVERT CE SOIR · ' + it.map(([k, v]) => v + ' ' + k.toUpperCase()).join(' · ') + (r.boosters ? ' · ' + r.boosters + ' BOOSTERS' : '');
      $('sub').textContent = 'RÉCAP DU LIVE · ' + r.hits.filter((h) => h.tier !== 'god').length + ' HITS · À TRÈS VITE SUR Z3 LIVE';
    }
  }
  else setInterval(function t() {
    const rem = (target - Date.now()) / 1000;
    $('count').textContent = rem > 0 ? fmt(rem) : (mode === 'soon' ? "C'EST PARTI !" : 'ON REVIENT !');
    return t;
  }(), 250);
})();
</script>
<script src="src/fx.js"></script>
</body>
</html>
